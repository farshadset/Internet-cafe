<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>چت با مشتری</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        .chat-layout {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            height: calc(100vh - 180px);
            min-height: 500px;
        }
        .chat-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem;
            background: #fff;
            border-radius: 12px;
            border: 1px solid #e9ecef;
        }
        .chat-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #f8f9fa;
            border-radius: 12px;
            border: 1px solid #e9ecef;
            min-width: 0;
            overflow: hidden;
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
        }
        .chat-input-area {
            padding: 1rem;
            background: #fff;
            border-top: 1px solid #e9ecef;
        }
        .typing-indicator {
            padding: 0.5rem 1rem;
            color: #999;
            font-size: 0.85rem;
            font-style: italic;
            min-height: 1.5rem;
            background: #f8f9fa;
            border-radius: 0 0 12px 12px;
        }
        .typing-indicator.hidden {
            visibility: hidden;
        }
        .canned-responses {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 0.75rem;
        }
        .canned-btn {
            background: #f0f0ff;
            border: 1px solid #d0d5f5;
            color: #333;
            padding: 0.5rem 0.75rem;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            font-family: inherit;
        }
        .canned-btn:hover {
            background: #d0d5f5;
        }
        .input-row {
            display: flex;
            gap: 0.5rem;
        }
        .input-row input {
            flex: 1;
        }
        @media (max-width: 768px) {
            .chat-layout {
                height: auto;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="logo-icon" title="صفحه اصلی">
            <i class="fas fa-mug-hot"></i>
        </a>
        <header>
            <h1>چت با مشتری</h1>
        </header>
        <main>
            <div class="chat-layout">
                <div class="chat-header">
                    <a href="admin-chat.html" class="btn-next" style="padding: 0.5rem 1rem; font-size: 0.9rem;">
                        <i class="fas fa-arrow-right"></i> بازگشت
                    </a>
                    <strong id="chatPartner">در حال بارگذاری...</strong>
                </div>
                <div class="chat-main">
                    <div class="chat-messages" id="adminChatMessages"></div>
                    <div class="typing-indicator hidden" id="typingIndicator">... در حال نوشتن است</div>
                    <div class="chat-input-area">
                        <div class="canned-responses" id="cannedResponses"></div>
                        <div class="input-row">
                            <input type="text" id="adminMessageInput" placeholder="پاسخ خود را اینجا بنویسید...">
                            <button id="adminSendBtn" class="btn-next" style="padding: 0.75rem 1.25rem;">ارسال</button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var params = new URLSearchParams(window.location.search);
            var username = params.get('username');
            if (!username) {
                window.location.href = 'admin-chat.html';
                return;
            }

            var chatMessages = document.getElementById('adminChatMessages');
            var adminMessageInput = document.getElementById('adminMessageInput');
            var adminSendBtn = document.getElementById('adminSendBtn');
            var chatPartner = document.getElementById('chatPartner');
            var typingIndicator = document.getElementById('typingIndicator');
            var cannedResponses = document.getElementById('cannedResponses');

            var socket = null;
            var pollingInterval = null;
            var typingTimer = null;
            var currentUsername = username;

            var canned = [
                'سلام، چطور می‌توانم کمک کنم؟',
                'مشکل شما به تیم فنی ارسال شد',
                'لطفاً شماره تماس خود را بفرستید'
            ];

            function renderCanned() {
                cannedResponses.innerHTML = '';
                canned.forEach(function(text) {
                    var btn = document.createElement('button');
                    btn.className = 'canned-btn';
                    btn.textContent = text;
                    btn.addEventListener('click', function() {
                        adminMessageInput.value = text;
                        adminMessageInput.focus();
                    });
                    cannedResponses.appendChild(btn);
                });
            }

            function scrollToBottom() {
                if (chatMessages.scrollHeight > chatMessages.parentElement.clientHeight) {
                    chatMessages.scrollTop = chatMessages.scrollHeight;
                }
            }

            function loadConversation() {
                fetch('/api/admin/chat/conversation?username=' + encodeURIComponent(currentUsername))
                    .then(function(r) { return r.json(); })
                    .then(function(messages) {
                        chatMessages.innerHTML = '';
                        if (messages.length === 0) {
                            chatMessages.innerHTML = '<p style="text-align:center;color:#999;">پیامی وجود ندارد</p>';
                            return;
                        }
                        messages.forEach(function(msg) {
                            var div = document.createElement('div');
                            div.className = 'message ' + (msg.role === 'admin' ? 'user' : 'support');
                            if (msg.role === 'admin') {
                                div.textContent = 'شما: ' + msg.text;
                            } else {
                                var usernameSpan = document.createElement('span');
                                usernameSpan.className = 'customer-username';
                                usernameSpan.textContent = msg.username + ': ';
                                div.appendChild(usernameSpan);
                                var textNode = document.createTextNode(msg.text);
                                div.appendChild(textNode);
                            }
                            chatMessages.appendChild(div);
                        });
                        scrollToBottom();
                    })
                    .catch(function() {});
            }

            function sendMessage() {
                var text = adminMessageInput.value.trim();
                if (!text) return;
                fetch('/api/admin/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: text })
                })
                .then(function(r) { return r.json(); })
                .then(function(msg) {
                    var div = document.createElement('div');
                    div.className = 'message user';
                    div.textContent = 'شما: ' + msg.text;
                    chatMessages.appendChild(div);
                    adminMessageInput.value = '';
                    scrollToBottom();
                    if (socket) {
                        socket.emit('admin-message', { username: currentUsername, text: msg.text });
                    }
                })
                .catch(function() {});
            }

            function initSocket() {
                if (typeof io === 'undefined') return;
                socket = io();
                socket.on('connect', function() {
                    socket.emit('join-admin-room');
                });
                socket.on('new-customer-message', function(data) {
                    if (data.username === currentUsername) {
                        loadConversation();
                    }
                });
                socket.on('customer-typing', function(data) {
                    if (data.username === currentUsername) {
                        typingIndicator.classList.remove('hidden');
                        if (typingTimer) clearTimeout(typingTimer);
                        typingTimer = setTimeout(function() {
                            typingIndicator.classList.add('hidden');
                        }, 2000);
                    }
                });
                socket.on('customer-stop-typing', function(data) {
                    if (data.username === currentUsername) {
                        typingIndicator.classList.add('hidden');
                        if (typingTimer) clearTimeout(typingTimer);
                    }
                });
            }

            chatPartner.textContent = 'چت با: ' + currentUsername;
            renderCanned();
            loadConversation();
            pollingInterval = setInterval(loadConversation, 10000);
            initSocket();

            adminSendBtn.addEventListener('click', sendMessage);
            adminMessageInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    sendMessage();
                }
                if (socket) {
                    socket.emit('typing-start', { username: currentUsername });
                    if (typingTimer) clearTimeout(typingTimer);
                    typingTimer = setTimeout(function() {
                        if (socket) socket.emit('typing-stop', { username: currentUsername });
                    }, 2000);
                }
            });

            window.addEventListener('beforeunload', function() {
                if (pollingInterval) clearInterval(pollingInterval);
                if (typingTimer) clearTimeout(typingTimer);
                if (socket) socket.disconnect();
            });
        });
    </script>
</body>
</html>
