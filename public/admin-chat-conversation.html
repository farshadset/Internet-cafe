<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>چت با مشتری</title>
    <script src="libs/utils.js"></script>
    <script>(function(){ if (!checkAdminAuth()) return; })();</script>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="fonts/all.css">
    <link rel="stylesheet" href="libs/notie.min.css">
    <script src="/socket.io/socket.io.js" async onerror="window._ioMissing=true"></script>
    <script src="libs/browser-image-compression.js"></script>
    <script src="libs/chat-core.js"></script>
    <style>
body{margin:0;padding:0;font-family:'Vazirmatn',system-ui,sans-serif;background:#f8f9fa;color:#111827;height:100dvh;overflow:hidden}
.layout{display:flex;height:100dvh;overflow:hidden}
.sidebar{width:300px;min-width:300px;background:#f8f9fa;border-left:1px solid #e9ecef;display:flex;flex-direction:column;overflow:hidden;transition:width .25s,min-width .25s}
.sidebar.collapsed{width:0;min-width:0;border-left:none}
.sidebar-toggle{position:fixed;top:12px;right:312px;z-index:100;width:40px;height:40px;border-radius:10px;border:1px solid #e9ecef;background:#fff;color:#667eea;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1.1rem;box-shadow:0 2px 8px rgba(0,0,0,.08);transition:all .2s}
.sidebar-toggle:hover{background:#f0f2ff;border-color:#667eea}
.sidebar.collapsed~.sidebar-toggle{right:12px}
.sidebar-header{padding:1rem;border-bottom:1px solid #e9ecef;display:flex;align-items:center;gap:.5rem;flex-shrink:0}
.sidebar-header h3{margin:0;font-size:.95rem;color:#333}
.conv-list{flex:1;overflow-y:auto;padding:.5rem}
.conv-item{display:block;padding:.7rem .8rem;background:#fff;border-radius:10px;cursor:pointer;border:1px solid transparent;transition:all .2s;text-align:right;margin-bottom:.35rem;position:relative}
.conv-item:hover{border-color:#667eea;background:#eef1ff}
.conv-item.active{background:#667eea;color:#fff}
.conv-item .ct{font-weight:700;font-size:.85rem;margin-bottom:.1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv-item .cp{font-size:.75rem;color:#888;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv-item.active .cp{color:rgba(255,255,255,.8)}
.conv-item .cd{font-size:.7rem;color:#999}
.conv-item.active .cd{color:rgba(255,255,255,.7)}
.conv-item.closed{opacity:.5}
.conv-badge{position:absolute;top:8px;left:8px;background:#e74c3c;color:#fff;font-size:.65rem;font-weight:700;padding:2px 6px;border-radius:8px;min-width:18px;text-align:center}
.conv-status{display:inline-block;width:6px;height:6px;border-radius:50%;margin-left:4px}
.conv-status.open{background:#27ae60}
.conv-status.closed{background:#e74c3c}
.main{flex:1;display:flex;flex-direction:column;min-width:0;height:100dvh;overflow:hidden}
.chat-header{padding:.75rem 1rem;border-bottom:1px solid #e9ecef;display:flex;align-items:center;gap:.5rem;flex-shrink:0;background:#fff}
.back-link{display:inline-flex;align-items:center;gap:.35rem;padding:.4rem .7rem;background:#fff;border:1px solid #e9ecef;border-radius:8px;text-decoration:none;color:#111827;font-size:.85rem;flex-shrink:0;margin-right:auto}
.back-link:hover{background:#f3f4f6}
.conv-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.conv-user{font-weight:700;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv-subject{font-size:.75rem;color:#888;cursor:pointer}
.conv-subject:hover{color:#667eea}
.hactions{display:flex;gap:.3rem;flex-shrink:0}
.hactions button{width:34px;height:34px;border-radius:8px;border:1px solid #e9ecef;background:#fff;color:#555;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.85rem;transition:all .15s}
.hactions button:hover{background:#f0f2ff;border-color:#667eea;color:#667eea}
.hactions button.active{background:#667eea;color:#fff;border-color:#667eea}
.close-btn{padding:.3rem .6rem;font-size:.75rem;border-radius:6px;border:1px solid #e74c3c;background:#fff;color:#e74c3c;cursor:pointer}
.close-btn:hover{background:#e74c3c;color:#fff}
.reopen-btn{padding:.3rem .6rem;font-size:.75rem;border-radius:6px;border:1px solid #27ae60;background:#fff;color:#27ae60;cursor:pointer}
.reopen-btn:hover{background:#27ae60;color:#fff}
.messages{flex:1;overflow-y:auto;padding:1rem;padding-bottom:.5rem;display:flex;flex-direction:column;gap:.6rem;min-height:0;background:#f8f9fa}
.input-area{padding:.75rem 1rem;padding-bottom:calc(.75rem + env(safe-area-inset-bottom,0px));border-top:1px solid #e9ecef;background:#fff;flex-shrink:0}
.input-wrap{position:relative;overflow:visible}
.input-area textarea{width:100%;min-height:80px;max-height:300px;display:block;padding:.7rem .75rem;padding-bottom:48px;border:1px solid #ddd;border-radius:8px;font-size:.9rem;font-family:inherit;resize:none;box-sizing:border-box;overflow-y:auto;scrollbar-width:none}
.input-area textarea::-webkit-scrollbar{display:none}
.input-area textarea:focus{outline:none;border-color:#667eea;box-shadow:0 0 0 3px rgba(102,126,234,.1)}
.attach-btn{position:absolute;bottom:8px;left:50px;width:36px;height:36px;background:#667eea;border:none;border-radius:10px;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:10;font-size:14px;transition:all .15s}
.attach-btn:hover{background:#5568d3}
.send-btn{position:absolute;bottom:8px;left:8px;width:36px;height:36px;border-radius:10px;border:none;background:#667eea;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:10;transition:all .15s}
.send-btn:hover{background:#5563d6}
.send-btn:disabled{background:#d1d5db;cursor:not-allowed}
.char-count{position:absolute;bottom:8px;left:92px;font-size:.7rem;color:#999;line-height:36px}
.att-preview{display:none;flex-wrap:wrap;gap:6px;padding:6px 1rem;background:#fff;border-top:1px solid #e9ecef;max-height:100px;overflow-y:auto}
.att-preview:not(.hidden){display:flex}
.compress-progress{display:none;padding:6px 1rem;background:#fff;border-top:1px solid #e9ecef;font-size:.8rem;color:#667eea;align-items:center;gap:8px}
.compress-progress.active{display:flex}
.compress-bar{flex:1;height:4px;background:#e5e7eb;border-radius:2px;overflow:hidden}
.compress-bar-fill{height:100%;background:#667eea;border-radius:2px;transition:width .2s;width:0}
.compress-text{white-space:nowrap;font-size:.75rem}
.typing-bar{padding:4px 16px;font-size:.75rem;color:#888;min-height:22px}
.empty-state{display:flex;align-items:center;justify-content:center;flex:1;color:#999;font-size:.95rem}
.notes-panel{width:0;overflow:hidden;transition:width .25s;background:#fff;border-right:1px solid #e9ecef;flex-shrink:0}
.notes-panel.open{width:280px}
.notes-inner{width:280px;height:100%;display:flex;flex-direction:column}
.notes-header{padding:.75rem 1rem;border-bottom:1px solid #e9ecef;display:flex;align-items:center;justify-content:space-between}
.notes-header h4{margin:0;font-size:.85rem}
.notes-body{flex:1;overflow-y:auto;padding:.75rem;display:flex;flex-direction:column;gap:.5rem}
.note-item{background:#f8f9fa;border-radius:8px;padding:.5rem .7rem;font-size:.8rem;position:relative}
.note-item .nt{word-break:break-word}
.note-item .nd{font-size:.65rem;color:#999;margin-top:.3rem}
.note-item .nx{position:absolute;top:4px;left:4px;background:none;border:none;color:#ccc;cursor:pointer;font-size:.7rem}
.note-item .nx:hover{color:#e74c3c}
.notes-input{padding:.5rem .75rem;border-top:1px solid #e9ecef;display:flex;gap:.4rem}
.notes-input input{flex:1;padding:.4rem .6rem;border:1px solid #ddd;border-radius:6px;font-size:.8rem;font-family:inherit}
.notes-input button{padding:.4rem .7rem;background:#667eea;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:.8rem}
.search-bar{padding:.5rem 1rem;border-bottom:1px solid #e9ecef;background:#fff;display:none}
.search-bar.open{display:flex;gap:.4rem}
.search-bar input{flex:1;padding:.4rem .6rem;border:1px solid #ddd;border-radius:6px;font-size:.8rem;font-family:inherit}
.search-bar button{padding:.4rem .7rem;background:#667eea;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:.8rem}
.search-results{padding:4px 1rem;background:#fff;border-bottom:1px solid #e9ecef;display:none;max-height:150px;overflow-y:auto;font-size:.8rem}
.search-results.open{display:block}
.search-results .si{padding:4px 0;cursor:pointer;border-bottom:1px solid #f3f4f6}
.search-results .si:hover{color:#667eea}
.canned-dropdown{position:absolute;bottom:100%;left:0;background:#fff;border:1px solid #e9ecef;border-radius:8px;box-shadow:0 -4px 12px rgba(0,0,0,.1);max-height:200px;overflow-y:auto;width:260px;display:none;z-index:20}
.canned-dropdown.open{display:block}
.canned-dropdown .ci{padding:.5rem .7rem;font-size:.8rem;cursor:pointer;border-bottom:1px solid #f3f4f6}
.canned-dropdown .ci:hover{background:#f0f2ff}
.conv-list::-webkit-scrollbar,.messages::-webkit-scrollbar{width:5px}
.conv-list::-webkit-scrollbar-track,.messages::-webkit-scrollbar-track{background:transparent}
.conv-list::-webkit-scrollbar-thumb,.messages::-webkit-scrollbar-thumb{background:#d1d5db;border-radius:10px}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@media(max-width:768px){
.sidebar{position:absolute;top:0;right:0;width:280px;min-width:280px;max-width:80vw;height:100%;border-left:none;z-index:200;box-shadow:-2px 0 12px rgba(0,0,0,.15)}
.sidebar.collapsed{width:0;min-width:0}
.sidebar-toggle{top:12px;right:12px;z-index:300}
.sidebar:not(.collapsed)~.sidebar-toggle{top:12px;right:auto;left:calc(100vw - 268px)}
.sidebar-overlay{display:none;position:absolute;inset:0;background:rgba(0,0,0,.3);z-index:150}
.sidebar:not(.collapsed)~.sidebar-overlay{display:block}
.back-link span{display:none}
.input-area{position:sticky;bottom:0;z-index:10;padding-bottom:env(safe-area-inset-bottom,8px)}
.input-area textarea{min-height:44px;max-height:150px}
.notes-panel.open{width:100%;position:absolute;inset:0;z-index:250}
.notes-inner{width:100%}
}
    </style>
</head>
<body>
<div class="layout">
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header"><i class="fas fa-user" style="color:#667eea"></i><h3 id="sidebarTitle">گفتگوها</h3></div>
        <div class="conv-list" id="convList"><div class="empty-state">در حال بارگذاری...</div></div>
    </div>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <button class="sidebar-toggle" id="sidebarToggle" title="لیست گفتگوها"><i class="fas fa-comments"></i></button>
    <div class="notes-panel" id="notesPanel">
        <div class="notes-inner">
            <div class="notes-header"><h4><i class="fas fa-sticky-note" style="color:#667eea"></i> یادداشت‌ها</h4><button id="closeNotes" style="background:none;border:none;cursor:pointer;color:#999"><i class="fas fa-times"></i></button></div>
            <div class="notes-body" id="notesBody"><div class="empty-state" style="font-size:.8rem">یادداشتی وجود ندارد</div></div>
            <div class="notes-input"><input type="text" id="noteInput" placeholder="یادداشت جدید..."><button id="addNote"><i class="fas fa-plus"></i></button></div>
        </div>
    </div>
    <div class="main">
        <div class="chat-header">
            <a href="admin-chat.html" class="back-link"><i class="fas fa-arrow-right"></i><span>بازگشت</span></a>
            <div class="conv-info"><span class="conv-user" id="convUser">یک گفتگو را انتخاب کنید</span><span class="conv-subject" id="convSubject" title="موضوع"></span></div>
            <div class="hactions">
                <button id="searchToggle" title="جستجو"><i class="fas fa-search"></i></button>
                <button id="notesToggle" title="یادداشت‌ها"><i class="fas fa-sticky-note"></i></button>
                <span id="closeReopenBtn" style="display:none"></span>
            </div>
        </div>
        <div class="search-bar" id="searchBar"><input type="text" id="searchInput" placeholder="جستجو..."><button id="searchBtn"><i class="fas fa-search"></i></button><button id="searchClose" style="background:#f3f4f6;color:#555"><i class="fas fa-times"></i></button></div>
        <div class="search-results" id="searchResults"></div>
        <div class="messages" id="messages"><div class="empty-state">یک گفتگو را انتخاب کنید</div></div>
        <div class="typing-bar" id="typingBar"></div>
        <div class="att-preview hidden" id="attPreview"></div>
        <div class="compress-progress" id="compressProgress"><div class="compress-bar"><div class="compress-bar-fill" id="compressBarFill"></div></div><span class="compress-text" id="compressText">در حال فشرده‌سازی...</span></div>
        <div class="input-area">
            <div class="input-wrap">
                <div class="canned-dropdown" id="cannedDropdown"></div>
                <textarea id="msgInput" rows="1" maxlength="5000" placeholder="پاسخ خود را اینجا بنویسید..."></textarea>
                <button class="send-btn" id="sendBtn" disabled><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg></button>
                <button class="attach-btn" id="attachBtn" title="افزودن فایل"><i class="fas fa-paperclip"></i></button>
                <span class="char-count" id="charCount">0/5000</span>
            </div>
            <input type="file" id="fileInput" accept="image/*,.heic,.heif,.pdf" style="display:none" multiple>
        </div>
    </div>
</div>
<script>
document.addEventListener('DOMContentLoaded',function(){
    var CC=ChatCore,U=ChillUtils,q=function(s){return document.querySelector(s)};
    var params=new URLSearchParams(window.location.search);
    var targetUser=params.get('username'),targetConv=params.get('conv');
    var sidebar=q('#sidebar'),sidebarToggle=q('#sidebarToggle'),sidebarOverlay=q('#sidebarOverlay');
    var convList=q('#convList'),messagesEl=q('#messages'),msgInput=q('#msgInput');
    var sendBtn=q('#sendBtn'),charCount=q('#charCount');
    var attPreview=q('#attPreview'),fileInput=q('#fileInput'),attachBtn=q('#attachBtn');
    var compressProgress=q('#compressProgress'),compressBarFill=q('#compressBarFill'),compressText=q('#compressText');
    var convUser=q('#convUser'),convSubject=q('#convSubject'),closeReopenBtn=q('#closeReopenBtn');
    var searchToggle=q('#searchToggle'),searchBar=q('#searchBar'),searchInput=q('#searchInput');
    var searchBtn=q('#searchBtn'),searchClose=q('#searchClose'),searchResults=q('#searchResults');
    var notesToggle=q('#notesToggle'),notesPanel=q('#notesPanel'),closeNotes=q('#closeNotes');
    var notesBody=q('#notesBody'),noteInput=q('#noteInput'),addNoteBtn=q('#addNote');
    var typingBar=q('#typingBar'),cannedDropdown=q('#cannedDropdown');

    var adminData=null;try{adminData=JSON.parse(localStorage.getItem('adminData')||'null')}catch(e){}
    var token=adminData?adminData.token:null,adminName=(adminData&&adminData.username)||'admin';
    var convs=[],currentConvId=null,lastMsgId=null,oldestId=null,hasMore=true,loadingMore=false;
    var curAtts=[],pendingReads={},activeReaders={};
    var PAGE=20,typingTimer=null,convClosed=false,scrollObserver=null;
    CC.injectChatStyles();

    function hdr(extra){var h=extra||{};if(token)h['Authorization']='Bearer '+token;return h}
    function aGet(u){return fetch(u,{headers:hdr({'Accept':'application/json'})}).then(function(r){if(r.status===401){localStorage.removeItem('adminData');window.location.href='login.html';return null}if(!r.ok)throw new Error('HTTP '+r.status);return r.text().then(function(t){try{return JSON.parse(t)}catch(e){return t}})}).catch(function(e){console.error('API Error:',u,e);throw e})}
    function aPost(u,d){return fetch(u,{method:'POST',headers:hdr({'Content-Type':'application/json'}),body:JSON.stringify(d)}).then(function(r){if(r.status===401){localStorage.removeItem('adminData');window.location.href='login.html';return null}return r.text().then(function(t){var x;try{x=JSON.parse(t)}catch(e){x={error:t||'خطای سرور'}}return{ok:r.ok,data:x}})}).catch(function(e){return{ok:false,data:{error:'خطا در ارتباط با سرور'}}})}
    function aDel(u){return fetch(u,{method:'DELETE',headers:hdr()}).then(function(r){return r.text().then(function(t){var x;try{x=JSON.parse(t)}catch(e){x={}}return{ok:r.ok,data:x}})}).catch(function(e){return{ok:false,data:{}}})}

    function initSocket(){
        if(!token)return;var socket=CC.initSocket(token);if(!socket)return;
        CC.setSocketCallbacks({
            currentRole:'admin',
            onNewMessage:function(d){
                if(d.conversationId===currentConvId&&d.role==='customer'){
                    var el=CC.renderMessage(d,{showSeen:true});
                    var empty=messagesEl.querySelector('.empty-state');
                    if(empty&&!q('#loadOlder'))messagesEl.innerHTML='';
                    messagesEl.appendChild(el);lastMsgId=d.id;autoScroll();markRead();
                }
                convs.forEach(function(c){if(c.id===d.conversationId){c.lastMessage=d.text;c.lastTimestamp=d.timestamp}});
            },
            onTyping:function(d){if(d.conversationId===currentConvId&&d.username!==adminName){typingBar.textContent=d.username+' در حال تایپ...';clearTimeout(typingBar._t);typingBar._t=setTimeout(function(){typingBar.textContent=''},3000)}},
            onStopTyping:function(d){if(d.conversationId===currentConvId)typingBar.textContent=''},
            onConversationClosed:function(d){if(d.conversationId===currentConvId){convClosed=true;renderCRBtn()}},
            onConversationReopened:function(d){if(d.conversationId===currentConvId){convClosed=false;renderCRBtn()}},
            onMessageSeen:function(d){if(d.conversationId===currentConvId&&d.role==='customer'){var ticks=messagesEl.querySelectorAll('.msg-admin .msg-tick');ticks.forEach(function(t){var mid=t.getAttribute('data-msg-tick');if(mid&&t.classList.contains('msg-sent'))CC.updateMessageTick(mid,'seen')})}}
        });
        if(currentConvId)CC.joinConversation(currentConvId);
    }

    function renderList(){
        convList.innerHTML='';
        if(!convs.length){convList.innerHTML='<div class="empty-state">هیچ گفتگویی وجود ندارد</div>';return}
        convs.forEach(function(c){
            var d=document.createElement('div');
            d.className='conv-item'+(c.id===currentConvId?' active':'')+(c.status==='closed'?' closed':'');
            d.setAttribute('data-conv-id',c.id);
            var preview=CC.truncate(c.lastMessage||'گفتگوی جدید',35);
            var dateStr=c.lastTimestamp?CC.formatDate(c.lastTimestamp):'';
            var sc=c.status==='closed'?'closed':'open';
            var label=c.subject||'گفتگوی '+dateStr;
            d.innerHTML='<div class="ct">'+U.escapeHtml(label)+'<span class="conv-status '+sc+'"></span></div><div class="cp">'+U.escapeHtml(preview)+'</div><div class="cd">'+dateStr+'</div>';
            if(c.unreadCount>0)d.innerHTML+='<span class="conv-badge">'+c.unreadCount+'</span>';
            d.addEventListener('click',function(){selectConv(c.id)});
            convList.appendChild(d);
        });
    }

    function selectConv(id){
        currentConvId=id;lastMsgId=null;oldestId=null;hasMore=true;loadingMore=false;
        var c=convs.find(function(x){return x.id===id});
        if(c){convUser.textContent=c.username;convSubject.textContent=c.subject||'';convSubject.title=c.subject||'موضوع تنظیم نشده';convClosed=c.status==='closed'}
        renderCRBtn();renderList();loadMsgs();markRead();CC.joinConversation(id);loadNotes();
        if(window.innerWidth<=768){sidebar.classList.add('collapsed');sidebarToggle.querySelector('i').className='fas fa-comments'}
    }

    function loadConvs(){
        convList.innerHTML='<div class="empty-state">در حال بارگذاری...</div>';
        var url='/api/admin/chat/conversations'+(targetUser?'?username='+encodeURIComponent(targetUser):'');
        aGet(url).then(function(d){convs=d||[];renderList();
            if(targetConv)selectConv(targetConv);else if(!currentConvId&&convs.length)selectConv(convs[0].id);
        }).catch(function(){convList.innerHTML='<div class="empty-state" style="color:#e74c3c">خطا در بارگذاری</div>'});
    }

    function loadMsgs(){
        if(!currentConvId){messagesEl.innerHTML='<div class="empty-state">یک گفتگو را انتخاب کنید</div>';return}
        messagesEl.innerHTML='<div class="empty-state">در حال بارگذاری...</div>';
        oldestId=null;hasMore=true;loadingMore=false;
        if(scrollObserver){scrollObserver.disconnect();scrollObserver=null}
        aGet('/api/admin/chat/conversation/'+currentConvId+'?limit='+PAGE).then(function(data){
            var msgs=data?data.messages||[]:[];
            hasMore=data?data.hasMore!==false&&msgs.length===PAGE:false;
            messagesEl.innerHTML='';
            msgs.forEach(function(m){messagesEl.appendChild(CC.renderMessage(m,{showSeen:true}))});
            if(msgs.length){oldestId=msgs[0].id;lastMsgId=msgs[msgs.length-1].id}
            setupSentinel();autoScroll();
        }).catch(function(){messagesEl.innerHTML='<div class="empty-state" style="color:#e74c3c">خطا در بارگذاری</div>'});
    }

    function loadOlder(){
        if(loadingMore||!hasMore||!currentConvId)return;loadingMore=true;
        var s=q('#loadOlder');if(s)s.textContent='در حال بارگذاری...';
        var prevH=messagesEl.scrollHeight;
        aGet('/api/admin/chat/conversation/'+currentConvId+'?limit='+PAGE+'&before='+encodeURIComponent(oldestId)).then(function(data){
            if(!data)return;var msgs=data.messages||[];
            hasMore=data.hasMore!==false&&msgs.length===PAGE;
            if(msgs.length){
                oldestId=msgs[0].id;
                var f=document.createDocumentFragment();
                msgs.forEach(function(m){f.appendChild(CC.renderMessage(m,{showSeen:true}))});
                messagesEl.insertBefore(f,messagesEl.firstChild);
                requestAnimationFrame(function(){messagesEl.scrollTop=messagesEl.scrollHeight-prevH});
                if(!hasMore&&s)s.remove();
            } else {hasMore=false;if(s)s.remove()}
            loadingMore=false;
        }).catch(function(){loadingMore=false});
    }

    function setupSentinel(){
        var old=q('#loadOlder');if(old)old.remove();if(!hasMore)return;
        var s=document.createElement('div');s.id='loadOlder';s.className='empty-state';
        s.style.cssText='cursor:pointer;color:#667eea;padding:.5rem;font-size:.85rem';
        s.textContent='بارگذاری پیام‌های قدیمی‌تر';s.addEventListener('click',loadOlder);
        messagesEl.insertBefore(s,messagesEl.firstChild);
        if(scrollObserver)scrollObserver.disconnect();
        scrollObserver=new IntersectionObserver(function(entries){
            if(entries[0].isIntersecting&&!loadingMore&&hasMore)loadOlder();
        },{root:messagesEl,threshold:0});
        scrollObserver.observe(s);
    }

    function autoScroll(){requestAnimationFrame(function(){messagesEl.scrollTop=messagesEl.scrollHeight})}
    function markRead(){if(!currentConvId)return;aPost('/api/admin/chat/read',{conversationId:currentConvId}).catch(function(){});var c=convs.find(function(x){return x.id===currentConvId});if(c){c.unreadCount=0;renderList()}}

    function sendMessage(){
        var text=msgInput.value.trim();
        if(text.length>CC.MAX_MESSAGE_LENGTH){U.showAlert('متن پیام بیش از حد مجاز','warning');return}
        if(!text&&!curAtts.length)return;
        var totalSz=0;curAtts.forEach(function(a){totalSz+=(a.dataUrl||'').length});
        if(totalSz>CC.MAX_TOTAL_SIZE){U.showAlert('حجم فایل‌ها زیاد است','error');return}
        var attsCopy=curAtts.slice();
        var pendingMsg={id:'pending_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),role:'admin',text:text,timestamp:new Date().toISOString(),conversationId:currentConvId,attachments:attsCopy};
        var empty=messagesEl.querySelector('.empty-state');
        if(empty&&!q('#loadOlder'))messagesEl.innerHTML='';
        messagesEl.appendChild(CC.renderMessage(pendingMsg,{pending:true}));autoScroll();
        msgInput.value='';curAtts=[];attPreview.innerHTML='';attPreview.classList.add('hidden');
        autoResize();updateBtn();CC.stopTyping(currentConvId,adminName);
        sendBtn.disabled=true;
        aPost('/api/admin/chat',{text:text,conversationId:currentConvId,attachments:attsCopy}).then(function(r){
            sendBtn.disabled=false;
            if(!r||!r.ok){U.showAlert(r&&r.data&&r.data.error||'خطا در ارسال','error');return}
            var msg=r.data;
            var pendingEl=messagesEl.querySelector('[data-msg-id="'+pendingMsg.id+'"]');
            if(pendingEl){pendingEl.setAttribute('data-msg-id',msg.id);pendingEl.querySelector('[data-msg-tick="'+pendingMsg.id+'"]').setAttribute('data-msg-tick',msg.id)}
            CC.updateMessageTick(msg.id,'sent');lastMsgId=msg.id;
        }).catch(function(){sendBtn.disabled=false;U.showAlert('خطا در ارتباط با سرور','error')});
    }

    function autoResize(){msgInput.style.height='auto';msgInput.style.height=Math.min(msgInput.scrollHeight,300)+'px';charCount.textContent=msgInput.value.length+'/5000';updateBtn()}
    function updateBtn(){sendBtn.disabled=(!msgInput.value.trim()&&!curAtts.length)||Object.keys(pendingReads).length>0}

    function showCompressProgress(){compressProgress.classList.add('active');compressBarFill.style.width='30%';compressText.textContent='در حال فشرده‌سازی تصویر...';setTimeout(function(){compressBarFill.style.width='60%'},500);setTimeout(function(){compressBarFill.style.width='85%'},1500)}
    function hideCompressProgress(){compressProgress.classList.remove('active');compressBarFill.style.width='0%'}

    function addAtt(file){
        if(curAtts.length>=CC.MAX_ATTACHMENTS){U.showToast('فقط چهار فایل مجاز');return}
        var v=CC.validateAttachment(file);
        if(!v.valid){
            if(v.compressible&&typeof U.showConfirm==='function'){
                U.showConfirm(v.error+'<br>آیا حجم تصویر کاهش یابد؟',function(ok){
                    if(ok){
                        showCompressProgress();
                        CC.compressOversizedImage(file).then(function(c){compressBarFill.style.width='100%';compressText.textContent='فشرده‌سازی کامل شد';setTimeout(hideCompressProgress,300);addAtt(c)}).catch(function(){hideCompressProgress();U.showToast('خطا در فشرده‌سازی')});
                    }
                });
            }else{U.showToast(v.error)}
            return;
        }
        var aid=CC.generateId('att_'),isImg=CC.isImageFile(file);
        attPreview.insertAdjacentHTML('beforeend',CC.renderAttachmentProgress(aid,file.name,isImg));
        attPreview.classList.remove('hidden');pendingReads[aid]=true;updateBtn();
        var proc=isImg?CC.compressImage(file,2):Promise.resolve(file);
        proc.then(function(ff){CC.readFileAsDataURL(ff).then(function(att){curAtts.push(att);var t=attPreview.querySelector('[data-att-id="'+aid+'"]');if(t)t.remove();attPreview.insertAdjacentHTML('beforeend',CC.renderAttachmentThumb(att));delete pendingReads[aid];updateBtn()}).catch(function(){var t=attPreview.querySelector('[data-att-id="'+aid+'"]');if(t)t.remove();delete pendingReads[aid];updateBtn();U.showToast('خطا در خواندن فایل')})}).catch(function(){var t=attPreview.querySelector('[data-att-id="'+aid+'"]');if(t)t.remove();delete pendingReads[aid];updateBtn()});
    }
    function rmAtt(id){if(activeReaders[id]){activeReaders[id].abort();delete activeReaders[id]}curAtts=curAtts.filter(function(a){return a.id!==id});var t=attPreview.querySelector('[data-att-id="'+id+'"]');if(t)t.remove();if(!attPreview.querySelector('.att-thumb'))attPreview.classList.add('hidden');updateBtn()}
    attPreview.addEventListener('click',function(e){var b=e.target.closest('.att-remove');if(b)rmAtt(b.getAttribute('data-remove')||b.getAttribute('data-cancel-read'))});
    attachBtn.addEventListener('click',function(){fileInput.click()});
    fileInput.addEventListener('change',function(e){var fs=Array.from(e.target.files||[]),rem=CC.MAX_ATTACHMENTS-curAtts.length-Object.keys(pendingReads).length;if(rem<=0){U.showToast('فقط چهار فایل مجاز');fileInput.value='';return}fs.slice(0,rem).forEach(function(f){addAtt(f)});fileInput.value=''});

    function renderCRBtn(){
        closeReopenBtn.innerHTML='';
        if(!currentConvId){closeReopenBtn.style.display='none';return}
        closeReopenBtn.style.display='inline-flex';
        var btn=document.createElement('button');
        btn.className=convClosed?'reopen-btn':'close-btn';
        btn.innerHTML=convClosed?'<i class="fas fa-undo"></i>':'<i class="fas fa-times"></i>';
        btn.title=convClosed?'بازگشایی':'بستن';
        btn.addEventListener('click',function(){
            var action=convClosed?'reopen':'close';
            aPost('/api/admin/chat/conversation/'+currentConvId+'/'+action,{}).then(function(r){
                if(r&&r.ok){convClosed=!convClosed;renderCRBtn();var c=convs.find(function(x){return x.id===currentConvId});if(c)c.status=convClosed?'closed':'open';renderList();U.showToast(convClosed?'گفتگو بسته شد':'گفتگو بازگشایی شد','success')}
            });
        });
        closeReopenBtn.appendChild(btn);
    }

    convSubject.addEventListener('click',function(){
        if(!currentConvId)return;var cur=convSubject.textContent||'',n=prompt('موضوع گفتگو:',cur);
        if(n===null||n===cur)return;
        aPost('/api/admin/chat/conversation/'+currentConvId+'/subject',{subject:n}).then(function(r){if(r&&r.ok){convSubject.textContent=n;convSubject.title=n||'موضوع تنظیم نشده';U.showToast('موضوع به‌روز شد','success')}});
    });

    searchToggle.addEventListener('click',function(){searchBar.classList.toggle('open');searchResults.classList.remove('open');if(searchBar.classList.contains('open'))searchInput.focus()});
    searchClose.addEventListener('click',function(){searchBar.classList.remove('open');searchResults.classList.remove('open');searchInput.value=''});
    searchBtn.addEventListener('click',doSearch);
    searchInput.addEventListener('keydown',function(e){if(e.key==='Enter')doSearch()});
    function doSearch(){
        var q2=searchInput.value.trim();if(!q2||!currentConvId)return;
        aGet('/api/chat/search?q='+encodeURIComponent(q2)+'&conversationId='+currentConvId).then(function(data){
            var results=Array.isArray(data)?data:[];searchResults.innerHTML='';
            if(!results.length)searchResults.innerHTML='<div style="padding:8px;color:#999">نتیجه‌ای یافت نشد</div>';
            results.forEach(function(r){var d=document.createElement('div');d.className='si';d.textContent=CC.truncate(r.text,60);d.addEventListener('click',function(){var el=messagesEl.querySelector('[data-msg-id="'+r.id+'"]');if(el){el.scrollIntoView({behavior:'smooth',block:'center'});el.style.background='#fffde7';setTimeout(function(){el.style.background=''},2000)}});searchResults.appendChild(d)});
            searchResults.classList.add('open');
        });
    }

    notesToggle.addEventListener('click',function(){notesPanel.classList.toggle('open');notesToggle.classList.toggle('active')});
    closeNotes.addEventListener('click',function(){notesPanel.classList.remove('open');notesToggle.classList.remove('active')});
    function loadNotes(){
        if(!currentConvId)return;
        aGet('/api/admin/chat/conversation/'+currentConvId+'/notes').then(function(data){
            var notes=Array.isArray(data)?data:[];notesBody.innerHTML='';
            if(!notes.length){notesBody.innerHTML='<div class="empty-state" style="font-size:.8rem">یادداشتی وجود ندارد</div>';return}
            notes.forEach(function(n){var d=document.createElement('div');d.className='note-item';d.innerHTML='<div class="nt">'+U.escapeHtml(n.text)+'</div><div class="nd">'+CC.formatDate(n.timestamp)+'</div><button class="nx" data-nid="'+n.id+'"><i class="fas fa-trash"></i></button>';notesBody.appendChild(d)});
        });
    }
    addNoteBtn.addEventListener('click',addNote);
    noteInput.addEventListener('keydown',function(e){if(e.key==='Enter')addNote()});
    function addNote(){var t=noteInput.value.trim();if(!t||!currentConvId)return;aPost('/api/admin/chat/conversation/'+currentConvId+'/notes',{text:t}).then(function(r){if(r&&r.ok){noteInput.value='';loadNotes();U.showToast('یادداشت اضافه شد','success')}})}
    notesBody.addEventListener('click',function(e){var b=e.target.closest('.nx');if(!b)return;var nid=b.getAttribute('data-nid');U.showConfirm('یادداشت حذف شود؟',function(){aDel('/api/admin/chat/note/'+nid).then(function(r){if(r&&r.ok){loadNotes();U.showToast('یادداشت حذف شد','success')}})})});

    var cannedData=[];
    function loadCanned(){aGet('/api/admin/chat/canned').then(function(d){cannedData=Array.isArray(d)?d:[]})}
    function showCanned(){
        if(!cannedData.length){loadCanned();return}
        cannedDropdown.innerHTML='';
        cannedData.forEach(function(c){var d=document.createElement('div');d.className='ci';d.textContent=c.title||c.text||c;d.addEventListener('click',function(){msgInput.value=c.text||c;cannedDropdown.classList.remove('open');autoResize();msgInput.focus()});cannedDropdown.appendChild(d)});
        cannedDropdown.classList.toggle('open');
    }
    document.addEventListener('click',function(e){if(!e.target.closest('.canned-dropdown')&&!e.target.closest('#msgInput'))cannedDropdown.classList.remove('open')});

    msgInput.addEventListener('input',function(){autoResize();if(currentConvId)CC.handleTyping(currentConvId,adminName)});
    msgInput.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}if(e.key==='/'&&!msgInput.value){e.preventDefault();showCanned()}});
    sendBtn.addEventListener('click',sendMessage);

    sidebarToggle.addEventListener('click',function(){sidebar.classList.toggle('collapsed');var c=sidebar.classList.contains('collapsed');sidebarToggle.querySelector('i').className=c?'fas fa-comments':'fas fa-chevron-right'});
    sidebarOverlay.addEventListener('click',function(){sidebar.classList.add('collapsed');sidebarToggle.querySelector('i').className='fas fa-comments'});
    if(window.innerWidth<=768){sidebar.classList.add('collapsed');sidebarToggle.querySelector('i').className='fas fa-comments'}

    if(window.visualViewport){var uvh=function(){document.documentElement.style.setProperty('--app-height',window.visualViewport.height+'px')};window.visualViewport.addEventListener('resize',uvh);uvh()}

    function updateSidebarTitle(){var el=q('#sidebarTitle');if(targetUser)el.textContent='گفتگوهای '+targetUser;else el.textContent='گفتگوها'}
    updateSidebarTitle();

    loadConvs();loadCanned();initSocket();
    window.addEventListener('beforeunload',function(){if(scrollObserver)scrollObserver.disconnect();var s=CC.getSocket();if(s)s.disconnect()});
});
</script>
</body>
</html>
