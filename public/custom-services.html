<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خدمات سفارشی</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <a href="index.html" class="logo-icon" title="صفحه اصلی">
            <i class="fas fa-mug-hot"></i>
        </a>
        <header>
            <h1>خدمات سفارشی</h1>
        </header>
        <main>
            <form id="customServicesForm" class="form-card">
                <div class="form-group">
                    <label for="serviceType">نوع خدمت</label>
                    <select id="serviceType" name="serviceType" required>
                        <option value="">انتخاب کنید...</option>
                        <option value="document">تدوین سند</option>
                        <option value="translation">ترجمه مدارک</option>
                        <option value="consultation">مشاوره</option>
                        <option value="other">سایر خدمات</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="customerName">نام و نام خانوادگی</label>
                    <input type="text" id="customerName" name="customerName" required>
                </div>

                <div class="form-group">
                    <label for="customerPhone">شماره تلفن</label>
                    <input type="tel" id="customerPhone" name="customerPhone" placeholder="09xx-xxx-xxxx" required>
                </div>

                <div class="form-group">
                    <label for="customerEmail">ایمیل</label>
                    <input type="email" id="customerEmail" name="customerEmail">
                </div>

                <div class="form-group">
                    <label for="serviceDescription">توضیحات خدمت</label>
                    <textarea id="serviceDescription" name="serviceDescription" rows="4" placeholder="جزئیات خدمت را توضیح دهید..." required></textarea>
                </div>

                <button type="submit" class="btn-next">ثبت درخواست</button>
            </form>
        </main>
    </div>
    <link rel="stylesheet" href="fonts/all.css">
    <script src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('customServicesForm');
            if (form) {
                form.addEventListener('submit', function(e) {
                    e.preventDefault();
                    const data = Object.fromEntries(new FormData(form));
                    localStorage.setItem('registrationData', JSON.stringify(data));
                    window.location.href = 'review.html';
                });
            }
        });
    </script>
</body>
</html>
