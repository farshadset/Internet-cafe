<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رزومه و استخدام</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <a href="index.html" class="logo-icon" title="صفحه اصلی">
            <i class="fas fa-mug-hot"></i>
        </a>
        <header>
            <h1>رزومه و استخدام</h1>
        </header>
        <main>
            <form id="resumeEmploymentForm" class="form-card">
                <div class="form-group">
                    <label for="serviceType">نوع خدمات</label>
                    <select id="serviceType" name="serviceType" required>
                        <option value="">انتخاب کنید...</option>
                        <option value="resume">نوشتن رزومه</option>
                        <option value="coverLetter">نامه توصیه</option>
                        <option value="linkedin">بهینه‌سازی لینکدین</option>
                        <option value="interview">مشاوره مصاحبه</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="jobField">رشته شغلی</label>
                    <input type="text" id="jobField" name="jobField" required>
                </div>

                <div class="form-group">
                    <label for="experienceYears">سال‌های تجربه</label>
                    <input type="number" id="experienceYears" name="experienceYears" min="0" required>
                </div>

                <div class="form-group">
                    <label for="skills">مهارت‌ها</label>
                    <textarea id="skills" name="skills" rows="3" placeholder="مهارت‌های خود را وارد کنید..."></textarea>
                </div>

                <div class="form-group">
                    <label for="targetJob">سمت شغل مورد نظر</label>
                    <input type="text" id="targetJob" name="targetJob">
                </div>

                <div class="form-group">
                    <label for="customerName">نام و نام خانوادگی</label>
                    <input type="text" id="customerName" name="customerName" required>
                </div>

                <div class="form-group">
                    <label for="customerPhone">شماره تلفن</label>
                    <input type="tel" id="customerPhone" name="customerPhone" placeholder="09xx-xxx-xxxx" required>
                </div>

                <button type="submit" class="btn-next">ثبت درخواست</button>
            </form>
        </main>
    </div>
    <link rel="stylesheet" href="fonts/all.css">
    <script src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('resumeEmploymentForm');
            if (form) {
                form.addEventListener('submit', function(e) {
                    e.preventDefault();
                    const data = Object.fromEntries(new FormData(form));
                    localStorage.setItem('registrationData', JSON.stringify(data));
                    window.location.href = 'review.html';
                });
            }
        });
    </script>
</body>
</html>
