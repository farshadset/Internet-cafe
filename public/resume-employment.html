<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">">
    <title>رزومه و استخدام</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="fonts/all.css">
</head>
<body>
    <header class="site">
        <div class="container header-row">
            <a class="btn btn-ghost back-link" href="index.html">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                <span>بازگشت به صفحه اصلی</span>
            </a>
        </div>
    </header>
    <main>
        <div class="container">
            <form id="resumeEmploymentForm" class="form-card order-form">
                <div class="card-strip"></div>
                <div class="f-grid">
                    <div class="f-field">
                        <label for="customerName">نام و نام خانوادگی</label>
                        <input type="text" id="customerName" name="customerName" required>
                    </div>

                    <div class="f-field">
                        <label for="customerPhone">شماره تلفن</label>
                        <input type="tel" id="customerPhone" name="customerPhone" placeholder="09123456789" value="09123456789" required class="phone-default" style="direction:ltr;text-align:left;color:#999;font-weight:400" onfocus="if(this.value==='09123456789'){this.value='';this.style.color='#122A33';this.style.fontWeight='400'}" onblur="if(!this.value){this.value='09123456789';this.style.color='#999';this.style.fontWeight='400'}">
                    </div>

                    <div class="f-field">
                        <label for="serviceType">نوع خدمات</label>
                        <select id="serviceType" name="serviceType" required>
                            <option value="">انتخاب کنید...</option>
                            <option value="resume">نوشتن رزومه</option>
                            <option value="coverLetter">نامه توصیه</option>
                            <option value="linkedin">بهینه‌سازی لینکدین</option>
                            <option value="interview">مشاوره مصاحبه</option>
                        </select>
                    </div>

                    <div class="f-field">
                        <label for="jobField">رشته شغلی</label>
                        <input type="text" id="jobField" name="jobField" required>
                    </div>

                    <div class="f-field">
                        <label for="experienceYears">سال‌های تجربه</label>
                        <input type="number" id="experienceYears" name="experienceYears" min="0" required>
                    </div>

                    <div class="f-field">
                        <label for="targetJob">سمت شغل مورد نظر</label>
                        <input type="text" id="targetJob" name="targetJob">
                    </div>

                    <div class="f-field">
                        <label for="proposedPrice">قیمت پیشنهادی (تومان)</label>
                        <input type="text" id="proposedPrice" name="proposedPrice" placeholder="قیمت مورد نظر خود را وارد کنید" required>
                        <small class="small">قیمت وارد شده بررسی و تایید یا اصلاح توسط مدیر خواهد شد</small>
                    </div>

                    <div class="f-field full">
                        <label for="skills">مهارت‌ها <span class="opt">(اختیاری)</span></label>
                        <textarea id="skills" name="skills" rows="2" placeholder="مهارت‌های خود را وارد کنید..."></textarea>
                    </div>

                    <div class="f-field full">
                        <label for="additionalNotes">توضیحات اضافی <span class="opt">(اختیاری)</span></label>
                        <div class="textarea-wrap">
                            <textarea id="additionalNotes" name="additionalNotes" rows="3" data-rtl-listener="true"></textarea>
                            <button type="button" class="attach-btn" onclick="document.getElementById('attachmentFile').click()" title="افزودن فایل"><i class="fas fa-paperclip"></i></button>
                        </div>
                        <div class="file-preview" id="attachmentPreview"></div>
                        <input type="file" id="attachmentFile" accept="image/*,.pdf" style="display: none;">
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">ثبت درخواست</button>
            </form>
        </div>
    </main>
    <script src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var userData = JSON.parse(localStorage.getItem('userData') || 'null');
            const form = document.getElementById('resumeEmploymentForm');
            setupPriceInputFormatting(document.getElementById('proposedPrice'));
            var attachmentFile = document.getElementById('attachmentFile');
            var attachmentPreview = document.getElementById('attachmentPreview');
            window.currentAttachments = window.currentAttachments || [];
            function escapeHtml(v){return String(v||'').replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'})[c]})}
            if(attachmentFile && attachmentPreview){
                attachmentFile.addEventListener('change', function(e){
                    var file = e.target.files[0];
                    if(!file) return;
                    if(file.type.startsWith('image/') && window.currentAttachments.filter(function(a){return a.type&&a.type.startsWith('image/');}).length>=4){alert('فقط می توان چهار فایل آپلود کرد');attachmentFile.value='';return;}
                    if(file.type==='application/pdf' && window.currentAttachments.filter(function(a){return a.type==='application/pdf';}).length>=4){alert('فقط می توان چهار فایل آپلود کرد');attachmentFile.value='';return;}
                    var id='att_'+Date.now()+'_'+Math.random().toString(16).slice(2);
                    var thumb=document.createElement('div');
                    thumb.className='file-thumb';
                    thumb.dataset.id=id;
                    var reader=new FileReader();
                    reader.onload=function(ev){
                        if(file.type.startsWith('image/')){
                            thumb.innerHTML='<img src="'+ev.target.result+'"><div class="file-name">'+escapeHtml(file.name)+'</div><button type="button" class="file-remove" onclick="window._removeSpecialAttach(\''+id+'\')">&times;</button>';
                        } else {
                            thumb.innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;background:#f0f0f0;font-size:10px;color:#666;text-align:center;padding:4px">'+escapeHtml(file.name)+'</div><button type="button" class="file-remove" onclick="window._removeSpecialAttach(\''+id+'\')">&times;</button>';
                        }
                        window.currentAttachments.push({id:id,name:file.name,type:file.type,size:file.size,dataUrl:ev.target.result,uploadedAt:new Date().toISOString()});
                        window.currentAttachments = window.currentAttachments;
                    };
                    reader.readAsDataURL(file);
                    attachmentPreview.appendChild(thumb);
                    attachmentFile.value='';
                });
            }
            window._removeSpecialAttach = function(id){
                window.currentAttachments = window.currentAttachments.filter(function(a){return a.id!==id});
                var thumb=document.querySelector('.file-thumb[data-id="'+id+'"]');
                if(thumb) thumb.remove();
            };
            function getAttachmentMetadata() {
                return (window.currentAttachments || []).map(function(attachment) {
                    return {
                        id: attachment.id,
                        name: attachment.name,
                        type: attachment.type,
                        size: attachment.size,
                        dataUrl: '',
                        uploadedAt: attachment.uploadedAt
                    };
                });
            }
            function saveRegistrationData(data, trackingCode) {
                localStorage.setItem('registrationData', JSON.stringify({
                    ...data,
                    attachments: getAttachmentMetadata()
                }));
                localStorage.setItem('lastTrackingCode', trackingCode);
            }
            if (form) {
                form.addEventListener('submit', async function(e) {
                    e.preventDefault();
                    const data = Object.fromEntries(new FormData(form));
                    data.serviceKey = 'resumeEmployment';
                    data.serviceTitle = 'رزومه و استخدام';
                    data.cost = 'قیمت توافقی - ' + document.getElementById('proposedPrice').value;
                    data.status = 'pending';
                    data.priceStatus = 'pending';
                    data.username = userData ? userData.username : null;
                    const uploadAttachments = Array.isArray(window.currentAttachments) ? window.currentAttachments : [];
                    data.attachments = uploadAttachments.map(attachmentForApiStorage);
                    try {
                        const response = await fetch('/api/order', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(data)
                        });
                        const result = await response.json();
                        await window.uploadAttachmentsForTrackingCode(result.trackingCode, uploadAttachments);
                        if (window.saveAttachmentsForTrackingCode && data.attachments.length > 0) {
                            await window.saveAttachmentsForTrackingCode(result.trackingCode, uploadAttachments);
                        }
                        saveRegistrationData(data, result.trackingCode);
                        window.location.href = 'success.html';
                    } catch (error) {
                        const fallbackCode = 'CFT-' + Date.now().toString().slice(-8);
                        await window.uploadAttachmentsForTrackingCode(fallbackCode, uploadAttachments);
                        if (window.saveAttachmentsForTrackingCode && data.attachments.length > 0) {
                            await window.saveAttachmentsForTrackingCode(fallbackCode, uploadAttachments);
                        }
                        saveRegistrationData(data, fallbackCode);
                        window.location.href = 'success.html';
                    }
                });
            }
        });
    </script>
</body>
</html>
