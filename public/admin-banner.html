<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدیریت بنرها</title>
    <script src="libs/utils.js"></script>
    <script src="libs/notie.min.js"></script>
    <script>
        (function(){ if (!checkAdminAuth()) return; })();
    </script>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="stylesheet" href="fonts/all.css">
    <link rel="stylesheet" href="libs/notie.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>مدیریت بنرها</h1>
        </header>
        <main>
            <div style="max-width:480px;margin:0 auto;display:flex;justify-content:flex-end;margin-bottom:0.5rem;">
                <a class="btn btn-ghost back-link" href="admin.html">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"></path></svg>
                    <span>بازگشت</span>
                </a>
            </div>
            <div class="form-card">
                <div style="margin-bottom: 15px; display: flex; align-items: center; gap: 0.5rem; justify-content: space-between; width: 100%;">
                    <label style="font-weight: 700; color: #333; white-space: nowrap;">گروه بنر:</label>
                    <div id="bannerGroupSelect" style="display: flex; gap: 0.5rem; align-items: center; direction: ltr;">
                        <button class="btn-confirm" id="addBannerBtn" onclick="openPopup()" style="width: 2.2rem; height: 2.2rem; padding: 0; border: 1px solid #ddd; border-radius: 8px; font-size: 1rem; font-weight: 400; line-height: 1; margin: 0; display: inline-flex; align-items: center; justify-content: center;" aria-label="افزودن بنر جدید">
                            <i class="fas fa-plus"></i>
                        </button>
                        <label class="banner-group-option active" style="width: 2.2rem; height: 2.2rem; padding: 0; border: 1px solid #ddd; border-radius: 8px; background: #667eea; color: #fff; cursor: pointer; display: inline-flex; align-items: center; justify-content: center;">
                            <input type="radio" name="bannerGroup" value="1" checked style="display: none;">
                            A
                        </label>
                        <label class="banner-group-option" style="width: 2.2rem; height: 2.2rem; padding: 0; border: 1px solid #ddd; border-radius: 8px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center;">
                            <input type="radio" name="bannerGroup" value="2" style="display: none;">
                            B
                        </label>
                    </div>
                </div>
                <div id="bannersList"></div>
            </div>
        </main>
    </div>

    <div class="popup-overlay" id="bannerPopup" style="display: none;">
        <div class="popup-content">
            <h3 id="popupTitle" style="display: none;">افزودن بنر جدید</h3>
            <div class="banner-preview" style="margin: 15px 0;">
                <p style="display: none;">پیش‌نمایش بنر</p>
                <img id="popupPreviewImg" src="https://placehold.co/800x200/667eea/ffffff?text=کافینت+آنلاین" alt="بنر" style="max-width: 100%;">
            </div>
            <div class="banner-info">
                <small>ابعاد پیشنهادی: 1920×600 پیکسل - حداکثر حجم: 2MB - قالب: JPG یا PNG</small>
            </div>
            <div class="form-group">
                <label for="popupBannerUpload">آپلود بنر</label>
                <input type="file" id="popupBannerUpload" accept="image/*,.heic,.heif">
                <div id="uploadProgress" style="display: none; margin-top: 10px;">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 4px;">
                        <small id="uploadStatus" style="color: #667eea; font-weight: 600;">پردازش تصویر...</small>
                        <small id="uploadPercent" style="color: #667eea; font-weight: 600;">0%</small>
                    </div>
                    <div style="width: 100%; height: 8px; background: #e9ecef; border-radius: 4px; overflow: hidden;">
                        <div id="uploadBar" style="width: 0%; height: 100%; background: linear-gradient(90deg, #667eea, #764ba2); border-radius: 4px; transition: width 0.3s ease;"></div>
                    </div>
                </div>
            </div>
            <div class="form-group">
                <label for="popupBannerLink">لینک بنر (اختیاری)</label>
                <input type="text" id="popupBannerLink" placeholder="https://example.com" dir="ltr">
            </div>
            <div class="form-group">
                <label for="popupBannerDuration">مدت زمان نمایش (ثانیه)</label>
                <input type="number" id="popupBannerDuration" placeholder="5" value="5" min="1" max="30">
            </div>
            <div class="form-actions">
                <button class="btn-confirm" id="saveBannerPopupBtn">ذخیره</button>
                <button class="btn-next" id="cancelBannerPopupBtn">لغو</button>
            </div>
        </div>
    </div>
    <script src="libs/utils.js"></script>
    <script src="app.js"></script>
    <script>
        (function(){ if (!checkAdminAuth()) return; })();
        function escapeHtml(v){return String(v||'').replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'})[c]})}
        var bannersData = [];
        var pendingBannerSrc = null;
        
        function compressImage(file, maxWidth = 1920, maxHeight = 600, quality = 0.92) {
            return new Promise((resolve, reject) => {
                var canvas = document.createElement('canvas');
                var ctx = canvas.getContext('2d');
                var img = new Image();
                img.onload = function() {
                    var ratio = Math.min(maxWidth / img.width, maxHeight / img.height, 1);
                    var width = Math.round(img.width * ratio);
                    var height = Math.round(img.height * ratio);
                    canvas.width = width;
                    canvas.height = height;
                    ctx.drawImage(img, 0, 0, width, height);
                    var name = (file.name || '').toLowerCase();
                    var mime = (file.type || '').toLowerCase();
                    var isPng = mime === 'image/png' || name.endsWith('.png');
                    var outputType = isPng ? 'image/png' : 'image/jpeg';
                    var dataUrl = canvas.toDataURL(outputType, isPng ? undefined : quality);
                    resolve(dataUrl);
                };
                img.onerror = function() { reject(new Error('Image load failed')); };
                img.src = URL.createObjectURL(file);
            });
        }

        function loadBanners() {
            var selectedGroup = getSelectedBannerGroup();
            if (!['1', '2'].includes(selectedGroup)) {
                selectedGroup = '1';
            }

            fetch('/api/banner')
                .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
                .then(allBanners => {
                    var groupBanners = allBanners.filter(b => parseInt(b.group || 1, 10) == selectedGroup);
                    bannersData = groupBanners;
                    var list = document.getElementById('bannersList');
                    var addBtn = document.getElementById('addBannerBtn');
                    addBtn.disabled = groupBanners.length >= 6;
                    addBtn.style.opacity = groupBanners.length >= 6 ? '0.5' : '1';
                    if (groupBanners.length === 0) {
                        list.innerHTML = '<p style="text-align: center; color: #666;">هیچ بنری برای این گروه ثبت نشده است</p>';
                        return;
                    }
                    list.innerHTML = groupBanners.map(function(banner) {
                        return '<div class="banner-item" data-id="' + escapeHtml(String(banner.id)) + '" style="display: flex; align-items: center; justify-content: space-between; padding: 10px; border: 1px solid #ddd; margin-bottom: 10px; border-radius: 8px;">' +
                            '<img src="' + escapeHtml(banner.src) + '" style="width: 120px; height: 60px; object-fit: cover; margin-left: 10px; border-radius: 4px;">' +
                            '<div style="display: flex; align-items: center; gap: 8px; margin-right: auto; direction: ltr;">' +
                            '<button class="delete-banner-btn" data-id="' + escapeHtml(String(banner.id)) + '" style="background: none; border: none; color: #e74c3c; cursor: pointer;"><i class="fas fa-trash"></i></button>' +
                            '<button class="edit-banner-btn" data-id="' + escapeHtml(String(banner.id)) + '" style="background: none; border: none; color: #667eea; cursor: pointer;"><i class="fas fa-edit"></i></button>' +
                            '</div>' +
                        '</div>';
                    }).join('');
                    
                    document.querySelectorAll('.edit-banner-btn').forEach(function(btn) {
                        btn.addEventListener('click', function() {
                            var id = this.getAttribute('data-id');
                            var banner = bannersData.find(b => b.id == id);
                            openEditBanner(banner.id, banner.src, banner.link, banner.duration, banner.group || 1);
                        });
                    });
                    document.querySelectorAll('.delete-banner-btn').forEach(function(btn) {
                        btn.addEventListener('click', function() {
                            if (this.disabled) return;
                            var self = this;
                            var id = this.getAttribute('data-id');
                            ChillUtils.showConfirm('آیا از حذف این بنر اطمینان دارید؟', function() {
                                self.disabled = true;
                                fetch('/api/banner/' + id, { method: 'DELETE' })
                                    .then(function(r) {
                                        if (r.ok) { loadBanners(); }
                                        else { ChillUtils.showAlert('خطا در حذف بنر', 'error'); self.disabled = false; }
                                    })
                                    .catch(function() { ChillUtils.showAlert('خطا در اتصال به سرور', 'error'); self.disabled = false; });
                            });
                        });
                    });
                })
                .catch(() => {});
        }

        var addBtn;
        var editingBannerId = null;
        var editingBannerGroup = null;

        function getSelectedBannerGroup() {
            var checked = document.querySelector('input[name="bannerGroup"]:checked');
            return checked ? checked.value : '1';
        }

        function setSelectedBannerGroup(group) {
            document.querySelectorAll('.banner-group-option').forEach(function(label) {
                var input = label.querySelector('input');
                var active = input.value == group;
                input.checked = active;
                label.classList.toggle('active', active);
                label.style.background = active ? '#667eea' : '#fff';
                label.style.color = active ? '#fff' : '#333';
            });
        }

        function openPopup() {
            var selectedGroup = getSelectedBannerGroup();
            if (bannersData && bannersData.length >= 6) {
                ChillUtils.showAlert('حداکثر تعداد بنرهای هر گروه ۶ عدد است. برای افزودن بنر جدید، یکی از بنرهای موجود را حذف کنید.');
                return;
            }
            pendingBannerSrc = null;
            document.getElementById('bannerPopup').style.display = 'flex';
            document.getElementById('popupTitle').textContent = 'افزودن بنر جدید';
            document.getElementById('popupPreviewImg').src = 'https://placehold.co/800x200/667eea/ffffff?text=کافینت+آنلاین';
            document.getElementById('popupBannerUpload').value = '';
            document.getElementById('popupBannerUpload').disabled = false;
            document.getElementById('popupBannerLink').value = '';
            document.getElementById('popupBannerDuration').value = '5';
            document.getElementById('uploadProgress').style.display = 'none';
            document.getElementById('uploadBar').style.width = '0%';
            document.getElementById('uploadBar').style.background = 'linear-gradient(90deg, #667eea, #764ba2)';
            document.getElementById('uploadStatus').textContent = 'پردازش تصویر...';
            document.getElementById('uploadPercent').textContent = '0%';
            document.getElementById('saveBannerPopupBtn').disabled = false;
            document.getElementById('saveBannerPopupBtn').textContent = 'ذخیره';
            editingBannerId = null;
            editingBannerGroup = null;
        }

        document.addEventListener('DOMContentLoaded', function() {
            setSelectedBannerGroup(getSelectedBannerGroup());
            loadBanners();

            document.getElementById('cancelBannerPopupBtn').addEventListener('click', function() {
                document.getElementById('bannerPopup').style.display = 'none';
            });

                var fileInput = document.getElementById('popupBannerUpload');
                fileInput.addEventListener('change', function(e) {
                    var file = e.target.files[0];
                    if (!file) return;
                    if (file.size > 5 * 1024 * 1024) {
                        ChillUtils.showAlert('حجم فایل نباید بیش از ۵ مگابایت باشد');
                        return;
                    }
                    fileInput.disabled = true;
                    var progressEl = document.getElementById('uploadProgress');
                var barEl = document.getElementById('uploadBar');
                var statusEl = document.getElementById('uploadStatus');
                var percentEl = document.getElementById('uploadPercent');
                progressEl.style.display = 'block';
                barEl.style.width = '0%';
                statusEl.textContent = 'پردازش تصویر...';
                percentEl.textContent = '0%';
                pendingBannerSrc = null;

                compressImage(file).then(function(dataUrl) {
                    document.getElementById('popupPreviewImg').src = dataUrl;
                    statusEl.textContent = 'آپلود تصویر...';

                    var serverInterval = null;
                    var serverProgress = 30;

                    var xhr = new XMLHttpRequest();
                    xhr.open('POST', '/api/banner/upload', true);
                    xhr.setRequestHeader('Content-Type', 'application/json');
                    xhr.upload.onprogress = function(e) {
                        if (e.lengthComputable) {
                            var pct = Math.round((e.loaded / e.total) * 60) + 30;
                            barEl.style.width = pct + '%';
                            percentEl.textContent = pct + '%';
                        }
                    };
                    xhr.onload = function() {
                        statusEl.textContent = 'ذخیره در سرور...';
                        serverProgress = 90;
                        barEl.style.width = '90%';
                        percentEl.textContent = '90%';
                        serverInterval = setInterval(function() {
                            if (serverProgress < 98) {
                                serverProgress++;
                                barEl.style.width = serverProgress + '%';
                                percentEl.textContent = serverProgress + '%';
                            }
                        }, 200);
                        try {
                            var res = JSON.parse(xhr.responseText);
                            clearInterval(serverInterval);
                            if (res.success && res.url) {
                                pendingBannerSrc = res.url;
                                barEl.style.width = '100%';
                                percentEl.textContent = '100%';
                                statusEl.textContent = 'آپلود موفق';
                                fileInput.disabled = false;
                                setTimeout(function() { progressEl.style.display = 'none'; }, 1200);
                            } else {
                                statusEl.textContent = 'خطا';
                                barEl.style.background = '#e74c3c';
                                fileInput.disabled = false;
                                ChillUtils.showAlert(res.error || 'خطا در آپلود تصویر', 'error');
                            }
                        } catch(ex) {
                            clearInterval(serverInterval);
                            statusEl.textContent = 'خطا';
                            barEl.style.background = '#e74c3c';
                            fileInput.disabled = false;
                            ChillUtils.showAlert('خطا در آپلود تصویر', 'error');
                        }
                    };
                    xhr.onerror = function() {
                        if (serverInterval) clearInterval(serverInterval);
                        statusEl.textContent = 'خطا';
                        barEl.style.background = '#e74c3c';
                        fileInput.disabled = false;
                        ChillUtils.showAlert('خطا در آپلود تصویر', 'error');
                    };
                    xhr.send(JSON.stringify({ image: { name: file.name, dataUrl: dataUrl } }));
                }).catch(function() { ChillUtils.showAlert('خطا در پردازش تصویر', 'error'); progressEl.style.display = 'none'; fileInput.disabled = false; });
            });

            document.getElementById('saveBannerPopupBtn').addEventListener('click', function() {
                var bannerSrc = pendingBannerSrc;
                if (!bannerSrc) {
                    ChillUtils.showAlert('لطفاً ابتدا تصویر بنر را آپلود کنید');
                    return;
                }
                var saveBtn = document.getElementById('saveBannerPopupBtn');
                saveBtn.disabled = true;
                saveBtn.textContent = 'در حال ذخیره...';
                var bannerLink = document.getElementById('popupBannerLink').value;
                var bannerDuration = parseInt(document.getElementById('popupBannerDuration').value, 10) || 5;
                var selectedGroup = parseInt(getSelectedBannerGroup(), 10) || 1;
                var bannerGroup = editingBannerId ? (editingBannerGroup || selectedGroup) : selectedGroup;

                function finish() {
                    saveBtn.disabled = false;
                    saveBtn.textContent = 'ذخیره';
                    document.getElementById('bannerPopup').style.display = 'none';
                    pendingBannerSrc = null;
                    loadBanners();
                }
                function fail(errMsg) {
                    saveBtn.disabled = false;
                    saveBtn.textContent = 'ذخیره';
                    ChillUtils.showAlert(errMsg);
                }

                if (editingBannerId) {
                    fetch('/api/banner/' + editingBannerId, {
                        method: 'PUT',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ src: bannerSrc, link: bannerLink, duration: bannerDuration, group: bannerGroup })
                    }).then(function(r) {
                        if (r.ok) {
                            finish();
                            showToast('بنر با موفقیت ویرایش شد');
                        } else {
                            ChillUtils.showAlert('خطا در ویرایش بنر', 'error');
                        }
                    }).catch(function(err) { fail('خطا: ' + err.message); });
                } else {
                    fetch('/api/banner', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ src: bannerSrc, link: bannerLink, duration: bannerDuration, group: bannerGroup })
                    })
                    .then(function(r) { return r.json().then(function(d) { return { ok: r.ok, data: d }; }); })
                    .then(function(result) {
                        if (result.ok) {
                            finish();
                            showToast('بنر با موفقیت ذخیره شد');
                        } else {
                            fail(result.data.error || 'خطا در ذخیره بنر');
                        }
                    })
                    .catch(function(err) { fail('خطا: ' + err.message); });
                }
            });

            document.querySelectorAll('input[name="bannerGroup"]').forEach(function(input) {
                input.addEventListener('change', function() {
                    if (this.checked) {
                        setSelectedBannerGroup(this.value);
                        loadBanners();
                    }
                });
            });
        });

        function openEditBanner(id, src, link, duration, group) {
            document.getElementById('bannerPopup').style.display = 'flex';
            document.getElementById('popupTitle').textContent = 'ویرایش بنر';
            document.getElementById('popupPreviewImg').src = src;
            document.getElementById('popupBannerUpload').value = '';
            document.getElementById('popupBannerUpload').disabled = false;
            document.getElementById('popupBannerLink').value = link || '';
            document.getElementById('popupBannerDuration').value = duration || 5;
            editingBannerId = id;
            editingBannerGroup = parseInt(group, 10) || 1;
            pendingBannerSrc = src;
        }

        var showToast = ChillUtils.showToast;
    </script>
</body>
</html>
