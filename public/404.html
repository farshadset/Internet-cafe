<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحه پیدا نشد | چیلی‌نت</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Vazirmatn',system-ui,sans-serif;background:#f8f9fa;color:#1e293b;min-height:100dvh;display:flex;flex-direction:column}
        .error-page{flex:1;display:flex;align-items:center;justify-content:center;padding:2rem}
        .error-container{text-align:center;max-width:520px;width:100%}
        .error-icon{width:120px;height:120px;margin:0 auto 2rem;position:relative}
        .error-icon svg{width:100%;height:100%}
        .error-code{font-size:6rem;font-weight:800;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;margin-bottom:0.5rem}
        .error-title{font-size:1.5rem;font-weight:700;color:#1e293b;margin-bottom:0.75rem}
        .error-desc{font-size:1rem;color:#64748b;line-height:1.8;margin-bottom:0.5rem}
        .error-hint{font-size:0.9rem;color:#667eea;background:linear-gradient(135deg,rgba(102,126,234,0.08),rgba(118,75,162,0.08));padding:1rem 1.5rem;border-radius:12px;border:1px solid rgba(102,126,234,0.15);margin-bottom:2rem;line-height:1.8}
        .error-actions{display:flex;flex-direction:column;gap:0.75rem;align-items:center}
        .btn-home{display:inline-flex;align-items:center;gap:0.5rem;padding:0.8rem 2rem;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#fff;text-decoration:none;border-radius:12px;font-size:1rem;font-weight:700;transition:all 0.2s;box-shadow:0 4px 15px rgba(102,126,234,0.3);border:none;cursor:pointer}
        .btn-home:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(102,126,234,0.4)}
        .btn-home:active{transform:translateY(0)}
        .btn-support{display:inline-flex;align-items:center;gap:0.5rem;padding:0.7rem 1.5rem;background:#fff;color:#667eea;text-decoration:none;border-radius:10px;font-size:0.9rem;font-weight:600;border:1.5px solid rgba(102,126,234,0.25);transition:all 0.2s;cursor:pointer}
        .btn-support:hover{border-color:#667eea;background:rgba(102,126,234,0.05)}
        .support-text{font-size:0.85rem;color:#94a3b8;margin-top:0.5rem}
        @media(max-width:640px){
            .error-code{font-size:4.5rem}
            .error-title{font-size:1.25rem}
            .error-desc{font-size:0.9rem}
            .error-hint{font-size:0.85rem;padding:0.8rem 1rem}
        }
    </style>
</head>
<body>
    <div class="error-page">
        <div class="error-container">
            <div class="error-icon">
                <svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="60" cy="60" r="58" stroke="url(#g1)" stroke-width="2" fill="rgba(102,126,234,0.04)"/>
                    <path d="M60 35v30" stroke="#667eea" stroke-width="4" stroke-linecap="round"/>
                    <circle cx="60" cy="80" r="4" fill="#667eea"/>
                    <circle cx="40" cy="50" r="2" fill="rgba(102,126,234,0.3)"/>
                    <circle cx="80" cy="45" r="3" fill="rgba(118,75,162,0.3)"/>
                    <circle cx="35" cy="70" r="2.5" fill="rgba(102,126,234,0.2)"/>
                    <circle cx="85" cy="72" r="2" fill="rgba(118,75,162,0.2)"/>
                    <path d="M25 90 Q60 70 95 90" stroke="rgba(102,126,234,0.15)" stroke-width="1.5" fill="none"/>
                    <defs>
                        <linearGradient id="g1" x1="0" y1="0" x2="120" y2="120">
                            <stop offset="0%" stop-color="#667eea"/>
                            <stop offset="100%" stop-color="#764ba2"/>
                        </linearGradient>
                    </defs>
                </svg>
            </div>
            <div class="error-code">404</div>
            <h1 class="error-title">صفحه‌ای که به دنبال آن هستید پیدا نشد!</h1>
            <p class="error-desc">نشانی وارد شده ممکن است اشتباه باشد یا صفحه حذف شده باشد.</p>
            <div class="error-hint">جستجو در خدمات ما می‌تواند بهترین راه برای یافتن آنچه نیاز دارید باشد.</div>
            <div class="error-actions">
                <a href="/" class="btn-home">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                    بازگشت به صفحه اصلی
                </a>
                <a href="/" onclick="setTimeout(function(){document.getElementById('bottomSupportBtn')?.click()},500)" class="btn-support">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
                    نیاز به کمک دارید؟ با پشتیبانی صحبت کنید
                </a>
                <p class="support-text">تیم پشتیبانی ما آماده کمک به شماست.</p>
            </div>
        </div>
    </div>
</body>
</html>
