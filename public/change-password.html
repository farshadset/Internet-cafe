<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تغییر رمز عبور</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="stylesheet" href="fonts/all.css">
    <link rel="stylesheet" href="libs/notie.min.css">
    <style>
        .orders-wrapper{max-width:480px;margin-inline:auto;padding-top:1rem}
        .back-link{display:block!important;margin-bottom:1rem;width:fit-content;margin-right:auto;border:1.5px solid rgba(255,255,255,.5);color:#fff;background:transparent;padding:9px 18px;border-radius:10px;text-decoration:none;font-weight:700;font-size:13.5px;font-family:inherit;cursor:pointer;transition:transform .15s ease,box-shadow .15s ease;display:inline-flex;align-items:center;gap:8px}
        .back-link:hover{border-color:#fff}
        @media(max-width:600px){.back-link span{display:none}}
    </style>
</head>
<body>
    <div class="container">
        <div class="orders-wrapper">
        <a class="btn btn-ghost back-link" href="javascript:void(0)" onclick="document.referrer ? history.back() : window.location='profile.html'">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"></path></svg>
            <span>بازگشت به پروفایل</span>
        </a>
        <main>
            <form id="changePasswordForm" class="form-card">
                <div class="form-group">
                    <label for="currentPassword">رمز عبور فعلی</label>
                    <span class="input-wrapper" style="position:relative;display:block">
                        <input type="password" id="currentPassword" name="currentPassword" required style="padding-right:2.5rem;box-sizing:border-box;width:100%" dir="ltr">
                        <span class="toggle-password" data-target="currentPassword" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);cursor:pointer;color:#666;background:none;border:none;font-size:1rem;z-index:2"><i class="fas fa-eye"></i></span>
                    </span>
                </div>
                <div class="form-group">
                    <label for="newPassword">رمز عبور جدید</label>
                    <span class="input-wrapper" style="position:relative;display:block">
                        <input type="password" id="newPassword" name="newPassword" required style="padding-right:2.5rem;box-sizing:border-box;width:100%" dir="ltr">
                        <span class="toggle-password" data-target="newPassword" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);cursor:pointer;color:#666;background:none;border:none;font-size:1rem;z-index:2"><i class="fas fa-eye"></i></span>
                    </span>
                </div>
                <div class="form-group">
                    <label for="confirmNewPassword">تکرار رمز عبور جدید</label>
                    <span class="input-wrapper" style="position:relative;display:block">
                        <input type="password" id="confirmNewPassword" name="confirmNewPassword" required style="padding-right:2.5rem;box-sizing:border-box;width:100%" dir="ltr">
                        <span class="toggle-password" data-target="confirmNewPassword" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);cursor:pointer;color:#666;background:none;border:none;font-size:1rem;z-index:2"><i class="fas fa-eye"></i></span>
                    </span>
                </div>
                <button type="submit" class="btn-next">ذخیره تغییرات</button>
            </form>
        </main>
    </div>
    </div>
    <script src="libs/browser-image-compression.js"></script>
    <script src="libs/utils.js"></script>
    <script src="libs/notie.min.js"></script>
    <script src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var userData = JSON.parse(localStorage.getItem('userData') || 'null');
            if (!userData) {
                window.location.href = 'login.html';
                return;
            }

            document.querySelectorAll('.toggle-password').forEach(function(icon) {
                icon.addEventListener('click', function() {
                    var targetId = this.getAttribute('data-target');
                    var isPassword = document.getElementById(targetId).type === 'password';
                    
                    if (targetId === 'newPassword' || targetId === 'confirmNewPassword') {
                        var newPwdInput = document.getElementById('newPassword');
                        var confirmPwdInput = document.getElementById('confirmNewPassword');
                        var newPwdIcon = document.querySelector('[data-target="newPassword"]');
                        var confirmPwdIcon = document.querySelector('[data-target="confirmNewPassword"]');
                        if (isPassword) {
                            newPwdInput.type = 'text';
                            confirmPwdInput.type = 'text';
                            newPwdIcon.innerHTML = '<i class="fas fa-eye-slash"></i>';
                            confirmPwdIcon.innerHTML = '<i class="fas fa-eye-slash"></i>';
                        } else {
                            newPwdInput.type = 'password';
                            confirmPwdInput.type = 'password';
                            newPwdIcon.innerHTML = '<i class="fas fa-eye"></i>';
                            confirmPwdIcon.innerHTML = '<i class="fas fa-eye"></i>';
                        }
                    } else {
                        var input = document.getElementById(targetId);
                        if (input.type === 'password') {
                            input.type = 'text';
                            this.innerHTML = '<i class="fas fa-eye-slash"></i>';
                        } else {
                            input.type = 'password';
                            this.innerHTML = '<i class="fas fa-eye"></i>';
                        }
                    }
                });
            });

            var form = document.getElementById('changePasswordForm');
            if (form) {
                form.addEventListener('submit', function(e) {
                    e.preventDefault();
                    var submitBtn = form.querySelector('[type="submit"]');
                    if (submitBtn && submitBtn.disabled) return;

                    var currentPwd = document.getElementById('currentPassword').value;
                    var newPwd = document.getElementById('newPassword').value;
                    var confirmPwd = document.getElementById('confirmNewPassword').value;

                    if (!currentPwd || !newPwd || !confirmPwd) {
                        ChillUtils.showAlert('لطفاً همه فیلدها را پر کنید.');
                        return;
                    }
                    if (newPwd !== confirmPwd) {
                        ChillUtils.showAlert('رمز عبور جدید و تکرار آن مطابقت ندارند.');
                        return;
                    }
                    if (newPwd.length < 8) {
                        ChillUtils.showAlert('رمز عبور جدید باید حداقل ۸ کاراکتر باشد.');
                        return;
                    }
                    if (!/[A-Z]/.test(newPwd) || !/[a-z]/.test(newPwd) || !/[0-9]/.test(newPwd)) {
                        ChillUtils.showAlert('رمز عبور باید شامل حروف بزرگ، کوچک و اعداد باشد.');
                        return;
                    }

                    if (submitBtn) { submitBtn.disabled = true; submitBtn.textContent = 'در حال تغییر...'; }
                    fetch('/api/change-password', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            currentPassword: currentPwd,
                            newPassword: newPwd
                        })
                    })
                    .then(function(r) { return r.json().then(function(d) { return { ok: r.ok, data: d }; }); })
                    .then(function(result) {
                        if (result.ok && result.data.success) {
                            var toast = document.createElement('div');
                            toast.className = 'toast-success';
                            toast.textContent = 'رمز عبور با موفقیت تغییر کرد!';
                            document.body.appendChild(toast);
                            setTimeout(function() { toast.classList.add('show'); }, 10);
                            setTimeout(function() {
                                toast.classList.remove('show');
                                setTimeout(function() { toast.remove(); }, 300);
                            }, 3000);
                            form.reset();
                        } else {
                            ChillUtils.showAlert(result.data.error || 'خطا در تغییر رمز عبور.', 'error');
                        }
                        if (submitBtn) { submitBtn.disabled = false; submitBtn.textContent = 'تغییر رمز عبور'; }
                    })
                    .catch(function() {
                        ChillUtils.showAlert('خطا در ارتباط با سرور.', 'error');
                        if (submitBtn) { submitBtn.disabled = false; submitBtn.textContent = 'تغییر رمز عبور'; }
                    });
                });
            }
        });
    </script>
</body>
</html>
