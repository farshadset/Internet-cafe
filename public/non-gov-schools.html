<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ثبت نام مدارس غیردولتی</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <a href="index.html" class="logo-icon" title="صفحه اصلی">
            <i class="fas fa-mug-hot"></i>
        </a>
        <header>
            <h1>ثبت نام مدارس غیردولتی</h1>
        </header>
        <main>
            <form id="serviceForm" class="form-card" data-service="non-gov-schools">
                <div class="form-group">
                    <label for="schoolType">نوع مدرسه</label>
                    <select id="schoolType" name="schoolType" required>
                        <option value="">انتخاب کنید</option>
                        <option value="international">مدارس بین‌الملل</option>
                        <option value="security">مدارس هیئت امنایی</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="parentPhone">شماره تلفن همراه پدر/مادر</label>
                    <input type="tel" id="parentPhone" name="parentPhone" placeholder="09xx-xxx-xxxx" required>
                </div>
                <div class="form-group">
                    <label for="parentNationalId">کد ملی والدین</label>
                    <input type="text" id="parentNationalId" name="parentNationalId" maxlength="10" required>
                </div>
                <div class="form-group">
                    <label for="studentNationalId">کد ملی دانش‌آموز</label>
                    <input type="text" id="studentNationalId" name="studentNationalId" maxlength="10" required>
                </div>
                <div class="form-group">
                    <label for="postalCode">کد پستی ۱۰ رقمی</label>
                    <input type="text" id="postalCode" name="postalCode" maxlength="10" required>
                </div>
                <div class="form-group">
                    <label for="preferredSchool">مدرسه مورد علاقه</label>
                    <input type="text" id="preferredSchool" name="preferredSchool">
                </div>
                <div class="form-group">
                    <label for="additionalNotes">توضیحات اضافی</label>
                    <textarea id="additionalNotes" name="additionalNotes" rows="3"></textarea>
                </div>
                <button type="submit" class="btn-next">ثبت درخواست</button>
            </form>
        </main>
    </div>
    <link rel="stylesheet" href="fonts/all.css">
    <script src="app.js"></script>
</body>
</html>
