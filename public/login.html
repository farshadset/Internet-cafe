<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود</title>
    <link rel="stylesheet" href="style.css?v=202606230630">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="stylesheet" href="fonts/all.css">
    <link rel="stylesheet" href="libs/notie.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>ورود</h1>
        </header>
        <main>
            <form id="loginForm" class="form-card">
                <div class="form-group">
                    <label for="loginUsername">نام کاربری</label>
                    <input type="text" id="loginUsername" name="loginUsername" placeholder="نام کاربری" required dir="auto" autocomplete="username">
                </div>
                
                <div class="form-group">
                    <label for="loginPassword">رمز عبور</label>
                    <div class="password-field">
                        <input type="password" id="loginPassword" name="loginPassword" placeholder="رمز عبور" required dir="ltr" autocomplete="current-password">
                        <span class="toggle-password" id="toggleLoginPassword">
                            <i class="fas fa-eye"></i>
                        </span>
                    </div>
                </div>
                
                <button type="submit" class="btn-next">ورود</button>
                <label style="display: block; margin-top: 0.5rem;">
                    <input type="checkbox" id="rememberMe"> ذخیره اطلاعات ورود
                </label>
                <div id="biometricLoginSection" style="display:none;margin-top:1rem;text-align:center;border-top:1px solid #eee;padding-top:1rem;">
                    <button type="button" id="biometricLoginBtn" style="width:100%;padding:10px;border:2px solid #667eea;background:#fff;color:#667eea;border-radius:10px;cursor:pointer;font-size:0.9rem;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:0.5rem;">
                        <i class="fas fa-fingerprint" style="font-size:1.2rem;"></i>
                        ورود با اثرانگشت
                    </button>
                    <div id="biometricLoginStatus" style="margin-top:0.5rem;font-size:0.8rem;color:#888;"></div>
                </div>
            </form>
            <p style="margin-top: 1rem;">
                <a href="auth.html">ثبت نام</a>
                | حساب کاربری ندارید؟
            </p>
        </main>
    </div>
    <div class="modal" id="supportModal">
    <div class="modal-content">
        <span class="close-btn" id="closeModal">&times;</span>
        <h2>پشتیبانی</h2>
        <div class="support-layout">
            <div class="support-sidebar" id="supportSidebar">
                <div class="sidebar-header">
                    <button class="new-chat-btn" id="newConversationBtn" title="گفتگوی جدید">
                        <i class="fas fa-plus"></i>
                    </button>
                    <h3>گفتگوها</h3>
                </div>
                <div class="conversations-list" id="conversationsList"></div>
            </div>
            <div class="support-main">
                <div class="support-panel" id="chatPanel">
                    <div class="admin-chat-main">
                        <div class="admin-chat-header">
                            <a href="admin-chat.html" class="back-link" style="display: none;">
                                <i class="fas fa-arrow-right"></i>
                                <span>بازگشت</span>
                            </a>
                            <strong id="chatPartner">پشتیبانی</strong>
                        </div>
                        <div class="admin-chat-messages customer-view" id="inlineChatMessages"></div>
                        <div class="admin-chat-input-area">
                            <div class="textarea-wrapper">
                                <textarea id="inlineMessageInput" rows="1" maxlength="5000" placeholder="پیام خود را اینجا بنویسید..." class="additional-notes"></textarea>
                                <div class="attachment-preview hidden" id="inlineAttachmentPreview"></div>
                                <button id="inlineSendBtn" class="admin-send-btn" aria-label="ارسال پیام">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                        <line x1="12" y1="19" x2="12" y2="5"></line>
                                        <polyline points="5 12 12 5 19 12"></polyline>
                                    </svg>
                                </button>
                                <button type="button" class="pin-attachment" id="inlinePinAttachment" title="افزودن فایل">
                                    <i class="fas fa-paperclip"></i>
                                </button>
                                <span class="char-counter" id="charCounter">5000/0</span>
                            </div>
                            <input type="file" id="inlineAttachmentFile" accept="image/*,.heic,.heif,.pdf" style="display: none;" multiple>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
    <script src="libs/browser-image-compression.js"></script>
    <script src="libs/utils.js"></script>
    <script src="libs/notie.min.js"></script>
    <script src="app.js"></script>
    <script>
        (function() {
            var biometricSection = document.getElementById('biometricLoginSection');
            var biometricBtn = document.getElementById('biometricLoginBtn');
            var biometricStatus = document.getElementById('biometricLoginStatus');
            var loginUsername = document.getElementById('loginUsername');

            if (WebAuthnClient.isSupported()) {
                WebAuthnClient.isPlatformAuthenticatorAvailable().then(function(available) {
                    if (available) biometricSection.style.display = '';
                });
            }

            biometricBtn.addEventListener('click', function() {
                var username = loginUsername.value.trim();
                if (!username) {
                    biometricStatus.textContent = 'لطفاً ابتدا نام کاربری را وارد کنید';
                    biometricStatus.style.color = '#e74c3c';
                    return;
                }
                biometricBtn.disabled = true;
                biometricStatus.textContent = 'در حال احراز هویت...';
                biometricStatus.style.color = '#667eea';
                WebAuthnClient.authenticate(username).then(function(result) {
                    if (result.isAdmin) {
                        localStorage.setItem('adminData', JSON.stringify({ username: username, token: result.token }));
                        window.location.href = 'admin.html';
                    } else {
                        localStorage.setItem('userData', JSON.stringify({ username: username, token: result.token }));
                        window.location.href = 'index.html';
                    }
                }).catch(function(e) {
                    biometricBtn.disabled = false;
                    biometricStatus.textContent = e.message || 'خطا در احراز هویت';
                    biometricStatus.style.color = '#e74c3c';
                });
            });
        })();
    </script>
</body>
</html>
