    <script>
        var _skelReady={banners:false,mega:false,allLoaded:false};
        function hideSkeleton(){
            if(!_skelReady.banners||!_skelReady.mega||!_skelReady.allLoaded) return;
            var el=document.getElementById('skeletonOverlay');
            if(el&&!el.classList.contains('hide')){
                el.classList.add('hide');
                setTimeout(function(){el.style.display='none'},400);
            }
        }
        window.addEventListener('load',function(){
            _skelReady.allLoaded=true;
            hideSkeleton();
        });
        document.addEventListener('DOMContentLoaded', function() {
            var bannerStates = {};

            function showBanners(banners, containerId) {
                var bannerContainer = document.getElementById(containerId);
                banners.forEach(function(b) {
                    if (!b.group) b.group = 1;
                });
                if (banners.length === 0) {
                    bannerContainer.innerHTML = '';
                    return;
                }

                var state = { currentIndex: 0, timeoutId: null };
                bannerStates[containerId] = state;

                function showBanner(index) {
                    state.currentIndex = index;
                    var banner = banners[index];
                    var dotsHtml = '<div class="banner-dots">';
                    banners.forEach(function(b, i) {
                        dotsHtml += '<span class="banner-dot ' + (i === index ? 'active' : '') + '" data-index="' + i + '"></span>';
                    });
                    dotsHtml += '</div>';

                    var html = '<div class="banner">';
                    html += '<img src="' + escapeHtml(banner.src) + '" alt="بنر کافینت" loading="lazy">' + dotsHtml + '</div>';

                    if (banner.link) {
                        html = '<a href="' + escapeHtml(banner.link) + '" class="banner-link" rel="noopener noreferrer">' + html + '</a>';
                    }
                    bannerContainer.innerHTML = html;

                    var dots = bannerContainer.querySelectorAll('.banner-dot');
                    dots.forEach(function(dot) {
                        dot.addEventListener('click', function() {
                            if (state.timeoutId) clearTimeout(state.timeoutId);
                            var idx = parseInt(this.getAttribute('data-index'));
                            showBanner(idx);
                        });
                    });

                    var duration = banner.duration || 5;
                    state.timeoutId = setTimeout(function() {
                        var nextIndex = (state.currentIndex + 1) % banners.length;
                        showBanner(nextIndex);
                    }, duration * 1000);
                }

                showBanner(0);
            }

            function fetchBanners(retryCount) {
                Promise.all([
                    fetch('/api/banner?group=1').then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}),
                    fetch('/api/banner?group=2').then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
                ]).then(function(results) {
                    showBanners(results[0], 'bannersContainer1');
                    showBanners(results[1], 'bannersContainer2');
                    _skelReady.banners=true;
                    hideSkeleton();
                }).catch(function(){
                    if (retryCount < 3) {
                        setTimeout(function(){ fetchBanners(retryCount + 1); }, 1000);
                    } else {
                        _skelReady.banners=true;
                        hideSkeleton();
                    }
                });
            }
            fetchBanners(0);

            setTimeout(function(){
                _skelReady.banners=true;
                _skelReady.mega=true;
                _skelReady.allLoaded=true;
                hideSkeleton();
            }, 8000);
        });
    </script>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            fetch('/api/mega-menu').then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.text()}).then(function(html){
                var container = document.getElementById('megaMenuContainer');
                var parser = new DOMParser();
                var doc = parser.parseFromString(html, 'text/html');
                var fragment = document.createDocumentFragment();
                while (doc.body.firstChild) {
                    fragment.appendChild(document.adoptNode(doc.body.firstChild));
                }
                container.appendChild(fragment);
                initMegaMenu();
            }).catch(function(){}).then(function(){
                _skelReady.mega=true;
                hideSkeleton();
            });
        });

        function initMegaMenu(){
            var wrap = document.getElementById('megaMenuWrap');
            var nav = wrap.querySelector('.main');
            if(!nav) return;
            var toggleBtn = document.createElement('button');
            toggleBtn.className = 'menu-toggle-btn';
            toggleBtn.setAttribute('aria-label', 'باز و بسته کردن منو');
            toggleBtn.setAttribute('aria-expanded', 'false');
            toggleBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>';
            toggleBtn.addEventListener('click', function(){
                var overlay = document.getElementById('menuOverlay');
                var sheet = document.getElementById('menuSheet');
                overlay.classList.add('show');
                sheet.classList.add('show');
                document.body.style.overflow='hidden';
            });
            wrap.insertBefore(toggleBtn, wrap.firstChild);
            document.querySelectorAll('.nav-item > .nav-link').forEach(function(btn){
                btn.addEventListener('click', function(){
                    var li = btn.parentElement;
                    var wasOpen = li.classList.contains('open');
                    document.querySelectorAll('.nav-item.open').forEach(function(o){o.classList.remove('open')});
                    if(!wasOpen) li.classList.add('open');
                });
            });
            document.addEventListener('click', function(e){
                if(!e.target.closest('.nav-item')){
                    document.querySelectorAll('.nav-item.open').forEach(function(o){o.classList.remove('open')});
                }
            });
            document.addEventListener('keydown', function(e){
                if(e.key === 'Escape'){
                    document.querySelectorAll('.nav-item.open').forEach(function(o){o.classList.remove('open')});
                }
            });
            (function(){
                var mobile = document.getElementById('mobileNav');
                if(!mobile) return;
                mobile.innerHTML = '';
                document.querySelectorAll('.mega-menu-wrap .nav-item').forEach(function(item){
                    var title = item.querySelector('.nav-link').textContent.trim();
                    var accordionItem = document.createElement('div');
                    accordionItem.className = 'accordion-item';
                    var header = document.createElement('button');
                    header.className = 'accordion-header';
                    header.setAttribute('aria-expanded', 'false');
                    header.textContent = title;
                    var body = document.createElement('div');
                    body.className = 'accordion-body';
                    var wrap = document.createElement('div');
                    wrap.className = 'm-group';
                    item.querySelectorAll('.mega-col').forEach(function(col){
                        var h = document.createElement('h5');
                        h.textContent = col.querySelector('h4').textContent.trim();
                        wrap.appendChild(h);
                        col.querySelectorAll('a').forEach(function(a){
                            var link = document.createElement('a');
                            link.href = a.getAttribute('href');
                            link.textContent = a.textContent;
                            wrap.appendChild(link);
                        });
                    });
                    body.appendChild(wrap);
                    accordionItem.appendChild(header);
                    accordionItem.appendChild(body);
                    mobile.appendChild(accordionItem);
                    header.addEventListener('click', function(){
                        var isOpen = header.getAttribute('aria-expanded') === 'true';
                        mobile.querySelectorAll('.accordion-header[aria-expanded="true"]').forEach(function(h){
                            h.setAttribute('aria-expanded', 'false');
                            h.nextElementSibling.style.maxHeight = '0';
                        });
                        if(!isOpen){
                            header.setAttribute('aria-expanded', 'true');
                            body.style.maxHeight = body.scrollHeight + 'px';
                        }
                    });
                });
            })();
        }

        document.addEventListener('DOMContentLoaded', function() {
            var searchInput = document.getElementById('searchInput');
            var searchResults = document.getElementById('searchResults');
            var debounceTimer = null;

            function highlightText(text, query) {
                if (!query) return text;
                var escaped = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
                var escapedQuery = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                var regex = new RegExp('(' + escapedQuery + ')', 'gi');
                return escaped.replace(regex, '<mark style="background:#3f3f46;color:#fff;border-radius:2px;padding:0 1px;">$1</mark>');
            }

            function showResults(matches, query) {
                searchResults.innerHTML = '';
                if (matches.length === 0 || searchInput.value.trim() === '') {
                    searchResults.style.display = 'none';
                    return;
                }

                var limitedMatches = matches.slice(0, 6);

                limitedMatches.forEach(function(match) {
                    var div = document.createElement('div');
                    div.innerHTML = highlightText(match.title, query);
                    div.addEventListener('click', function() {
                        window.location.href = match.link;
                        searchInput.value = '';
                        searchResults.style.display = 'none';
                    });
                    searchResults.appendChild(div);
                });

                searchResults.style.display = 'block';
            }

            function performSearch(query) {
                var searchTerm = query.toLowerCase().trim();

                if (searchTerm === '') {
                    searchResults.style.display = 'none';
                    return;
                }

                var searchIndex = window.megaMenuSearchIndex || [];
                var matches = searchIndex.filter(function(item) {
                    return item.title.toLowerCase().includes(searchTerm);
                });

                showResults(matches, searchTerm);
            }

            searchInput.addEventListener('input', function() {
                clearTimeout(debounceTimer);
                var query = this.value;
                debounceTimer = setTimeout(function() {
                    performSearch(query);
                }, 120);
            });

            document.addEventListener('click', function(e) {
                if (searchInput && searchResults && !searchInput.contains(e.target) && !searchResults.contains(e.target)) {
                    searchResults.style.display = 'none';
                }
            });
        });

        document.getElementById('profileBtnBottom')?.addEventListener('click', function(e){
            e.preventDefault();
            document.getElementById('profileBtn')?.click();
        });
        document.getElementById('sidebarProfileBtn')?.addEventListener('click', function(){
            document.getElementById('profileBtn')?.click();
        });

        // Support sidebar toggle
        (function(){
            var toggle = document.getElementById('sidebarConvToggle');
            var sidebar = document.getElementById('supportSidebar');
            if(!toggle || !sidebar) return;
            toggle.addEventListener('click', function(){
                sidebar.classList.toggle('expanded');
            });
        })();

        // Sidebar toggle
        (function(){
            var sidebar = document.getElementById('desktopSidebar');
            var overlay = document.getElementById('sidebarOverlay');
            if(!sidebar) return;
            sidebar.addEventListener('mouseenter', function(){
                sidebar.classList.add('expanded');
                if(overlay) overlay.classList.add('show');
                document.body.classList.add('sidebar-open');
            });
            sidebar.addEventListener('mouseleave', function(){
                sidebar.classList.remove('expanded');
                if(overlay) overlay.classList.remove('show');
                document.body.classList.remove('sidebar-open');
            });
            if(overlay) overlay.addEventListener('click', function(){
                sidebar.classList.remove('expanded');
                overlay.classList.remove('show');
                document.body.classList.remove('sidebar-open');
            });
        })();
    </script>
    <div class="menu-overlay" id="menuOverlay"></div>
    <div class="menu-sheet" id="menuSheet">
        <div class="menu-sheet-handle"></div>
        <div class="menu-sheet-header">
            <h3>منو</h3>
            <button class="menu-sheet-close" id="menuSheetClose">&times;</button>
        </div>
        <div class="menu-sheet-body">
            <div class="mobile-nav" id="mobileNav"></div>
        </div>
    </div>
    <script>
        // Menu bottom sheet
        var menuOverlay = document.getElementById('menuOverlay');
        var menuSheet = document.getElementById('menuSheet');
        var bottomMenuBtn = document.getElementById('bottomMenuBtn');
        var menuSheetClose = document.getElementById('menuSheetClose');

        function openMenuSheet(){
            menuOverlay.classList.add('show');
            menuSheet.classList.add('show');
            document.body.style.overflow='hidden';
        }
        function closeMenuSheet(){
            menuOverlay.classList.remove('show');
            menuSheet.classList.remove('show');
            document.body.style.overflow='';
        }
        if(bottomMenuBtn) bottomMenuBtn.addEventListener('click', openMenuSheet);
        if(menuSheetClose) menuSheetClose.addEventListener('click', closeMenuSheet);
        if(menuOverlay) menuOverlay.addEventListener('click', closeMenuSheet);

        // Load social links from localStorage
        (function() {
            var saved = localStorage.getItem('caffint_social_links');
            if (saved) {
                try {
                    var data = JSON.parse(saved);
                    var socialLinks = document.querySelectorAll('.sidebar-social a');
                    socialLinks.forEach(function(link) {
                        var title = link.getAttribute('title');
                        if (title === 'واتساپ' && data.whatsapp) link.href = data.whatsapp;
                        else if (title === 'تلگرام' && data.telegram) link.href = data.telegram;
                        else if (title === 'بله' && data.bale) link.href = data.bale;
                        else if (title === 'روبیکا' && data.robika) link.href = data.robika;
                    });
                } catch(e) {}
            }
        })();

        // Track visit (skip if admin)
        (function() {
            var isAdmin = localStorage.getItem('adminData');
            if (!isAdmin) {
                fetch('/api/track-visit', { method: 'POST', keepalive: true }).catch(function() {});
            }
        })();
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('/sw.js').catch(function() {});
            });
        }
    </script>
