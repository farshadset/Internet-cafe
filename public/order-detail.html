<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جزئیات سفارش</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;800&family=Markazi+Text:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="fonts/all.css">
    <style>
:root{--ink:#122A33;--deep:#0B3B4A;--firouzeh:#17A2A6;--firouzeh-dark:#0E7E82;--firouzeh-soft:#E4F3F3;--gold:#E2A93B;--paper:#227164;--card:#FEFFF7;--line:#D8E4E4;--muted:#5B7078;--radius:14px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Vazirmatn",Tahoma,sans-serif;background:var(--paper);color:var(--ink);line-height:1.9;font-size:15px}
a{color:inherit;text-decoration:none}
.container{max-width:720px;margin-inline:auto;padding:2rem;text-align:center}
header h1{color:#fff;font-family:"Markazi Text","Vazirmatn",serif;font-size:24px;margin-bottom:1.5rem}
.order-summary{padding:30px}
.order-summary h2{font-family:"Markazi Text","Vazirmatn",serif;font-size:24px;color:var(--deep);font-weight:700;margin-bottom:20px;text-align:center}
.summary-card{background:var(--card);border-radius:12px;padding:20px;margin-bottom:20px;box-shadow:0 2px 12px rgba(11,59,74,.08)}
.summary-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.summary-row:last-child{border-bottom:none}
.summary-row .label{color:#333;font-size:14px;font-weight:700}
.summary-row .value{color:var(--deep);font-weight:700;font-size:14px;text-align:right}
.summary-row.total{background:var(--firouzeh-soft);margin:15px -20px -20px;padding:15px 20px;border-radius:0 0 12px 12px;border-top:2px solid var(--firouzeh)}
.summary-row.total .label{color:var(--deep);font-weight:800;font-size:15px}
.summary-row.total .value{color:var(--firouzeh-dark);font-weight:800;font-size:18px}
.btn{display:flex;align-items:center;justify-content:center;width:100%;padding:14px;border-radius:var(--radius);font-family:inherit;font-size:15px;font-weight:700;border:none;cursor:pointer;transition:all .15s}
.btn-primary{background:var(--firouzeh);color:#fff}
.btn-primary:hover{background:var(--firouzeh-dark)}
.btn-ghost{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.4)}
.btn-ghost:hover{border-color:rgba(255,255,255,.8);color:#fff}
.status-badge{display:inline-block;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:700}
.status-pending{background:#FFF3CD;color:#856404}
.status-processing{background:#D1ECF1;color:#0C5460}
.status-completed{background:#D4EDDA;color:#155724}
.status-rejected{background:#F8D7DA;color:#721C24}
.paid-badge{background:#D4EDDA;color:#155724}
.detail-attachment-btn{background:var(--line);border:none;border-radius:8px;padding:6px 10px;cursor:pointer;font-size:13px;color:var(--deep);margin-top:4px}
.detail-attachment-btn:hover{background:var(--firouzeh);color:#fff}
@media(max-width:600px){.order-summary{padding:20px}.summary-row{flex-direction:column;align-items:flex-start;gap:4px}.summary-row .value{text-align:right}}
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>جزئیات سفارش</h1>
        </header>
        <main>
            <div class="order-summary" id="orderDetail">
                <div class="summary-card">
                    <p style="text-align:center;color:var(--muted)">بارگذاری...</p>
                </div>
            </div>
        </main>
    </div>
    <script src="app.js?v=20260707"></script>
    <script src="service-extra-configs.js"></script>
    <script>
        var FIELD_LABELS = {
            name: 'نام و نام خانوادگی', phone: 'شماره تلفن', nationalId: 'کد ملی', note: 'توضیحات',
            birthYear: 'سال تولد', birthMonth: 'ماه تولد', birthDay: 'روز تولد', email: 'ایمیل',
            ownerPhone: 'شماره تلفن', ownerNationalId: 'کد ملی', vin: 'شماره VIN',
            applicantPhone: 'شماره تلفن', applicantNationalId: 'کد ملی', idNumber: 'شماره شناسنامه',
            regionCode: 'کد منطقه', educationLevel: 'سطح تحصیلی', contractNumber: 'شماره قرارداد',
            depositAmount: 'مبلغ ودیعه', iban: 'شماره شبا', sheba: 'شماره شبا', ownershipStatus: 'وضعیت مالکیت',
            familyCount: 'تعداد افراد', passportNumber: 'شماره پاسپورت', examType: 'نوع آزمون',
            address: 'آدرس', operator: 'اپراتور', birthplace: 'محل تولد',
            serialNumber: 'سریال', familyMembers: 'تعداد افراد خانواده',
            birth: 'تاریخ تولد', father: 'نام پدر', postal: 'کد پستی',
            plate: 'شماره پلاک', car: 'نوع خودرو', passport: 'شماره گذرنامه قبلی',
            taxcode: 'کد اقتصادی', activity: 'نوع فعالیت / شغل', biz: 'نام پیشنهادی شرکت / برند',
            bank: 'بانک موردنظر', amount: 'مبلغ درخواستی (تومان)', grade: 'مقطع / رشته تحصیلی',
            exam: 'عنوان آزمون / دانشگاه', workshop: 'کد کارگاه بیمه'
        };
    </script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var params = new URLSearchParams(window.location.search);
            var code = params.get('code');
            var container = document.getElementById('orderDetail');
            
            function isSpecialService(order) {
                return order.serviceKey === 'resumeEmployment' || 
                       order.serviceKey === 'customServices' || 
                       order.serviceKey === 'articlesResearch' ||
                       (order.jobField || order.experienceYears || order.skills) ||
                       (order.researchType || order.subject || order.academicLevel) ||
                       order.serviceDescription;
            }
            
            function getServiceTitle(order) {
                var serviceTitle = (order.title && order.title !== '-') ? order.title : (order.serviceTitle || '-');
                if (serviceTitle && serviceTitle !== '-') return serviceTitle;
                
                var isFuelCard = order.ownerPhone || order.ownerNationalId || order.vin;
                var isMarriageLoan = order.applicantPhone || order.applicantNationalId || order.idNumber;
                var isKonkor = order.regionCode || order.educationLevel || order.applicantNationalId;
                var isRental = order.contractNumber || order.depositAmount || order.iban;
                var isHousing = order.ownershipStatus || order.familyCount;
                var isIeltsToefl = order.passportNumber || order.examType;
                var isInternet = order.address || order.operator;
                var isCriminalRecord = order.birthplace;
                var isSmartCard = order.serialNumber;
                var isHealthInsurance = order.familyMembers;
                
                if (isFuelCard) return 'کارت سوخت';
                else if (isMarriageLoan) return 'وام ازدواج';
                else if (isKonkor) return 'کنکور سراسری';
                else if (isRental) return 'ودیعه مسکن اجاره';
                else if (isHousing) return 'نهضت ملی مسکن';
                else if (isIeltsToefl) return 'ثبت‌نام تافل و آیلتس';
                else if (isInternet) return 'ثبت‌نام اینترنت پرسرعت';
                else if (isCriminalRecord) return 'گواهی عدم سوء پیشینه';
                else if (isSmartCard) return 'کارت ملی هوشمند';
                else if (isHealthInsurance) return 'بیمه سلامت';
                else if (order.serviceKey === 'resumeEmployment') return 'رزومه و استخدام';
                else if (order.serviceKey === 'articlesResearch') return 'مقاله و تحقیق';
                else if (order.serviceKey === 'customServices') return 'خدمات سفارشی';
                else return 'پیش ثبت نام مدارس';
            }
            
            function formatValue(value, options) {
                if (value === undefined || value === null || value === '') return null;
                return options ? (options[value] || value) : value;
            }
            
            function escapeOrderHtml(value) {
                return String(value || '').replace(/[&<>"']/g, function(char) {
                    return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' })[char];
                });
            }

            function mergeAttachments(apiAttachments, savedAttachments) {
                var merged = [];
                var seen = {};
                (apiAttachments || []).concat(savedAttachments || []).forEach(function(attachment) {
                    if (!attachment) return;
                    var key = attachment.id || (attachment.name + '|' + attachment.type + '|' + attachment.size);
                    if (seen[key]) return;
                    seen[key] = true;
                    merged.push(attachment);
                });
                return merged;
            }

            function hasAttachmentData(apiAttachments) {
                return (apiAttachments || []).some(function(attachment) {
                    return attachment && (attachment.dataUrl || attachment.url);
                });
            }
            
            function renderFormFields(order) {
                var html = '';
                var serviceKey = order.serviceKey;
                
                function addRow(label, val) {
                    if (!val) return;
                    html += '<div class="summary-row"><span class="label">' + escapeOrderHtml(label) + '</span><span class="value">' + escapeOrderHtml(val) + '</span></div>';
                }

                if (serviceKey === 'resumeEmployment') {
                    var resumeServiceType = { resume: 'نوشتن رزومه', coverLetter: 'نامه توصیه', linkedin: 'بهینه‌سازی لینکدین', interview: 'مشاوره مصاحبه' };
                    addRow('نوع خدمات', formatValue(order.serviceType, resumeServiceType));
                    addRow('رشته شغلی', order.jobField);
                    addRow('سال‌های تجربه', order.experienceYears);
                    addRow('مهارت‌ها', order.skills);
                    addRow('سمت شغل مورد نظر', order.targetJob);
                    addRow('نام و نام خانوادگی', order.customerName);
                    addRow('شماره تلفن', order.customerPhone);
                } else if (serviceKey === 'articlesResearch') {
                    var researchTypeOpts = { article: 'نوشتن مقاله', research: 'تحقیق علمی', translation: 'ترجمه مقالات', editing: 'ویرایش مقالات' };
                    var academicLevelOpts = { bachelor: 'کارشناسی', master: 'کارشناسی ارشد', phd: 'دکتری' };
                    addRow('نوع خدمات', formatValue(order.researchType, researchTypeOpts));
                    addRow('رشته / موضوع', order.subject);
                    addRow('سطح تحصیلی', formatValue(order.academicLevel, academicLevelOpts));
                    addRow('تعداد صفحات', order.pagesCount);
                    addRow('مهلت تحویل', order.deadline);
                    addRow('نام و نام خانوادگی', order.customerName);
                    addRow('شماره تلفن', order.customerPhone);
                } else if (serviceKey === 'customServices') {
                    var customServiceOpts = { document: 'تدوین سند', translation: 'ترجمه مدارک', consultation: 'مشاوره', other: 'سایر خدمات' };
                    addRow('نوع خدمت', formatValue(order.serviceType, customServiceOpts));
                    addRow('نام و نام خانوادگی', order.customerName);
                    addRow('شماره تلفن', order.customerPhone);
                } else {
                    addRow('نام و نام خانوادگی', order.name);
                    addRow('شماره تلفن', order.phone);
                    addRow('کد ملی', order.nationalId);
                    addRow('دسته‌بندی', order.category);
                    
                    if (order.extraFields && typeof order.extraFields === 'object') {
                        Object.keys(order.extraFields).forEach(function(key) {
                            var val = order.extraFields[key];
                            if (!val) return;
                            var label = FIELD_LABELS[key] || key;
                            addRow(label, val);
                        });
                    }
                    
                    var otherFields = ['birthYear', 'birthMonth', 'birthDay', 'email', 
                        'ownerPhone', 'ownerNationalId', 'vin', 'applicantPhone', 'applicantNationalId', 
                        'idNumber', 'regionCode', 'educationLevel', 'contractNumber', 'depositAmount', 
                        'iban', 'ownershipStatus', 'familyCount', 'passportNumber', 'examType', 
                        'address', 'operator', 'birthplace', 'serialNumber', 'familyMembers'];
                    var labels = {
                        birthYear: 'سال تولد', birthMonth: 'ماه تولد', birthDay: 'روز تولد', email: 'ایمیل',
                        ownerPhone: 'شماره تلفن', ownerNationalId: 'کد ملی', vin: 'شماره VIN',
                        applicantPhone: 'شماره تلفن', applicantNationalId: 'کد ملی', idNumber: 'شماره شناسنامه',
                        regionCode: 'کد منطقه', educationLevel: 'سطح تحصیلی', contractNumber: 'شماره قرارداد',
            depositAmount: 'مبلغ ودیعه', iban: 'شماره شبا', sheba: 'شماره شبا', ownershipStatus: 'وضعیت مالکیت',
                        familyCount: 'تعداد افراد', passportNumber: 'شماره پاسپورت', examType: 'نوع آزمون',
                        address: 'آدرس', operator: 'اپراتور', birthplace: 'محل تولد',
                        serialNumber: 'سریال', familyMembers: 'تعداد افراد خانواده'
                    };
                    otherFields.forEach(function(field) {
                        addRow(labels[field], order[field]);
                    });
                }
                
                return html;
            }
            
            if (!code) {
                container.innerHTML = '<p style="text-align:center;color:red;">کد سفارش نامعتبر است.</p>';
                return;
            }
            fetch('/api/order/' + encodeURIComponent(code))
                .then(function(r) { return r.json(); })
                .then(function(order) {
                    if (!order || order.error) {
                        container.innerHTML = '<p style="text-align:center;color:red;">سفارش پیدا نشد.</p>';
                        return;
                    }
                    
                    var serviceTitle = getServiceTitle(order);
                    var isPricePending = order.status === 'pending' && isSpecialService(order) && ['pending', 'countersent', 'usercounter'].includes(order.priceStatus);
                    var isPriceAccepted = order.status === 'pending' && isSpecialService(order) && order.priceStatus === 'accepted' && !order.paid;
                    
                    var statusLabels = { pending: 'در صف انتظار', processing: 'در حال انجام', completed: 'انجام شده', rejected: 'رد شده' };
                    
                    var paymentLabel = isPricePending 
                        ? 'در انتظار تایید قیمت' 
                        : isPriceAccepted
                        ? 'در انتظار پرداخت'
                        : order.paid ? 'پرداخت شده' : order.status === 'pending' ? 'پرداخت شده' : statusLabels[order.status] || order.status;
                    
                    var paymentClass = isPricePending || isPriceAccepted
                        ? 'status-pending'
                        : order.paid ? 'paid-badge' : order.status === 'pending' ? 'paid-badge' : 'status-completed';
                    
                    var paymentRow = '<div class="summary-row"><span class="label">وضعیت پرداخت</span><span class="value"><span class="' + paymentClass + '">' + paymentLabel + '</span></span></div>';
                    
                    var priceRow = '';
                    if (isSpecialService(order)) {
                        if (['pending', 'countersent', 'usercounter'].includes(order.priceStatus)) {
                            var displayedPrice = order.priceStatus === 'countersent' ? order.adminProposedPrice : order.proposedPrice;
                            priceRow = '<div class="summary-row"><span class="label">قیمت پیشنهادی</span><span class="value">' + formatPrice(displayedPrice) + ' تومان</span></div>';
                        } else if (order.priceStatus === 'accepted') {
                            priceRow = '<div class="summary-row"><span class="label">قیمت نهایی</span><span class="value">' + formatPrice(order.adminProposedPrice || order.proposedPrice) + ' تومان</span></div>';
                        }
                    }
                    
                    var paymentButton = '';
                    if (isSpecialService(order) && order.priceStatus === 'accepted' && !order.paid) {
                        paymentButton = '<button id="confirmPaymentStatusBtn" class="btn btn-primary" style="margin-top:10px">تایید پرداخت</button>';
                    }
                    
var formFieldsHtml = renderFormFields(order);
                    
                    (async function() {
                        var additionalNotes = order.additionalNotes || '';
                        var savedAttachments = [];
                        if (!hasAttachmentData(order.attachments)) {
                            for (var i = 0; i < 20 && !window.getAttachmentsForTrackingCode; i++) {
                                await new Promise(r => setTimeout(r, 100));
                            }
                            if (window.getAttachmentsForTrackingCode) {
                                savedAttachments = await window.getAttachmentsForTrackingCode(order.trackingCode) || [];
                            }
                        }
                        var allAttachments = mergeAttachments(order.attachments, savedAttachments);
                        
                        // Build file previews
                        var filesHtml = '';
                        if (allAttachments.length > 0) {
                            filesHtml = '<div class="summary-row"><span class="label">فایل‌های پیوست</span><span class="value"><div style="display:flex;flex-wrap:wrap;gap:8px">';
                            allAttachments.forEach(function(att) {
                                var fileName = att.name || att.fileName || 'فایل';
                                var isImage = att.type && att.type.startsWith('image/') || (att.dataUrl && att.dataUrl.startsWith('data:image'));
                                var src = att.dataUrl || att.url || '';
                                if (isImage && src) {
                                    filesHtml += '<div style="position:relative;width:100px;border-radius:8px;overflow:hidden;border:1.5px solid var(--line)"><img src="' + src + '" style="width:100%;height:80px;object-fit:cover;display:block"><div style="font-size:9px;text-align:center;padding:2px;background:rgba(0,0,0,.05)">' + escapeOrderHtml(fileName) + '</div><a href="' + src + '" download="' + escapeOrderHtml(fileName) + '" style="position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:var(--firouzeh);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;text-decoration:none" title="دانلود"><i class="fas fa-download"></i></a></div>';
                                } else {
                                    filesHtml += '<div style="width:100px;height:100px;border-radius:8px;overflow:hidden;border:1.5px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;background:#f8f8f8;position:relative"><i class="fas fa-file" style="font-size:24px;color:var(--muted);margin-bottom:4px"></i><div style="font-size:9px;text-align:center;padding:2px 4px;word-break:break-all">' + escapeOrderHtml(fileName) + '</div>' + (src ? '<a href="' + src + '" download="' + escapeOrderHtml(fileName) + '" style="position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:var(--firouzeh);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;text-decoration:none" title="دانلود"><i class="fas fa-download"></i></a>' : '') + '</div>';
                                }
                            });
                            filesHtml += '</div></span></div>';
                        }
                        
                        var notesText = order.note || order.additionalNotes || '';
                        
                        // Build summary in form order
                        var summaryHtml = '<div class="summary-card">' +
                            '<div class="summary-row"><span class="label">نوع خدمت</span><span class="value">' + serviceTitle + '</span></div>';
                        
                        if (order.category) {
                            summaryHtml += '<div class="summary-row"><span class="label">دسته‌بندی</span><span class="value">' + escapeOrderHtml(order.category) + '</span></div>';
                        }
                        
                        summaryHtml += formFieldsHtml;
                        
                        if (notesText) {
                            summaryHtml += '<div class="summary-row"><span class="label">توضیحات</span><span class="value">' + escapeOrderHtml(notesText) + '</span></div>';
                        }
                        
                        summaryHtml += filesHtml;
                        summaryHtml += priceRow;
                        summaryHtml += paymentRow;
                        var totalCost = order.adminProposedPrice || order.proposedPrice || order.cost || 0;
                        summaryHtml += '<div class="summary-row total"><span class="label">مبلغ قابل پرداخت</span><span class="value">' + formatPrice(totalCost) + ' تومان</span></div>';
                        summaryHtml += '</div>';
                        
                        container.innerHTML = summaryHtml +
                            paymentButton +
                            '<a href="javascript:history.back()" class="btn btn-ghost" style="margin-top:10px">بازگشت</a>';
                        
                        var priceSnapshot = JSON.stringify({
                            status: order.status,
                            priceStatus: order.priceStatus,
                            proposedPrice: order.proposedPrice,
                            adminProposedPrice: order.adminProposedPrice,
                            cost: order.cost
                        });
                        
                        var priceRefreshTimer = setInterval(function() {
                            if (document.visibilityState && document.visibilityState !== 'visible') {
                                return;
                            }
                            
                            fetch('/api/order/' + encodeURIComponent(code))
                                .then(function(r) { return r.json(); })
                                .then(function(latestOrder) {
                                    if (!latestOrder || latestOrder.error) return;
                                    
                                    var latestSnapshot = JSON.stringify({
                                        status: latestOrder.status,
                                        priceStatus: latestOrder.priceStatus,
                                        proposedPrice: latestOrder.proposedPrice,
                                        adminProposedPrice: latestOrder.adminProposedPrice,
                                        cost: latestOrder.cost
                                    });
                                    
                                    if (latestSnapshot !== priceSnapshot) {
                                        priceSnapshot = latestSnapshot;
                                        location.reload();
                                    }
                                })
                                .catch(function() {});
                        }, 5000);
                        
                        window.addEventListener('beforeunload', function() {
                            clearInterval(priceRefreshTimer);
                        });
                        
                        var confirmPaymentBtn = document.getElementById('confirmPaymentStatusBtn');
                        if (confirmPaymentBtn) {
                            confirmPaymentBtn.addEventListener('click', function() {
                                fetch('/api/order/pay', {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({ trackingCode: code })
                                })
                                .then(function(r) { return r.json(); })
                                .then(function(res) {
                                    if (res.success) {
                                        location.reload();
                                    }
                                })
                                .catch(function() {});
                            });
                        }
                    })()
                })
                .catch(function(err) {
                    console.error('Order detail error:', err);
                    container.innerHTML = '<div class="summary-card"><p style="text-align:center;color:red;">خطا در بارگذاری جزئیات. لطفاً دوباره تلاش کنید.</p></div>';
                });
        });
    </script>
</body>
</html>
