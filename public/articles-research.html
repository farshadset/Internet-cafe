<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مقاله و تحقیق</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="fonts/all.css">
</head>
<body>
    <header class="site">
        <div class="container header-row">
            <a class="btn btn-ghost back-link" href="index.html">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                <span>بازگشت به صفحه اصلی</span>
            </a>
        </div>
    </header>
    <main>
        <div class="container">
            <form id="articlesResearchForm" class="form-card order-form">
                <div class="card-strip"></div>
                <div class="f-grid">
                    <div class="f-field">
                        <label for="researchType">نوع خدمات</label>
                        <select id="researchType" name="researchType" required>
                            <option value="">انتخاب کنید...</option>
                            <option value="article">نوشتن مقاله</option>
                            <option value="research">تحقیق علمی</option>
                            <option value="translation">ترجمه مقالات</option>
                            <option value="editing">ویرایش مقالات</option>
                        </select>
                    </div>

                    <div class="f-field">
                        <label for="subject">رشته / موضوع</label>
                        <input type="text" id="subject" name="subject" required>
                    </div>

                    <div class="f-field">
                        <label for="academicLevel">سطح تحصیلی</label>
                        <select id="academicLevel" name="academicLevel" required>
                            <option value="">انتخاب کنید...</option>
                            <option value="bachelor">کارشناسی</option>
                            <option value="master">کارشناسی ارشد</option>
                            <option value="phd">دکتری</option>
                        </select>
                    </div>

                    <div class="f-field">
                        <label for="pagesCount">تعداد صفحات</label>
                        <input type="number" id="pagesCount" name="pagesCount" min="1" required>
                    </div>

                    <div class="f-field">
                        <label for="customerName">نام و نام خانوادگی</label>
                        <input type="text" id="customerName" name="customerName" required>
                    </div>

                    <div class="f-field">
                        <label for="customerPhone">شماره تلفن</label>
                        <input type="tel" id="customerPhone" name="customerPhone" placeholder="09xx-xxx-xxxx" required>
                    </div>

                    <div class="f-field">
                        <label for="proposedPrice">قیمت پیشنهادی (تومان)</label>
                        <input type="text" id="proposedPrice" name="proposedPrice" placeholder="قیمت مورد نظر خود را وارد کنید" required>
                        <small class="small">قیمت وارد شده بررسی و تایید یا اصلاح توسط مدیر خواهد شد</small>
                    </div>

                    <div class="f-field">
                        <label>مهلت تحویل</label>
                        <div style="display:flex;gap:0.25rem;align-items:center;flex-direction:row-reverse;direction:rtl;">
                            <input type="number" id="deadlineYear" name="deadlineYear" placeholder="سال" min="1400" max="1500" style="width:4rem;padding:0.25rem;">
                            <span style="color:#666;">/</span>
                            <input type="number" id="deadlineMonth" name="deadlineMonth" placeholder="ماه" min="1" max="12" style="width:3rem;padding:0.25rem;" onkeyup="if(this.value.length>=2)document.getElementById('deadlineYear').focus()">
                            <span style="color:#666;">/</span>
                            <input type="number" id="deadlineDay" name="deadlineDay" placeholder="روز" min="1" max="31" style="width:3rem;padding:0.25rem;" onkeyup="if(this.value.length>=2)document.getElementById('deadlineMonth').focus()">
                        </div>
                    </div>

                    <div class="f-field full">
                        <label for="additionalNotes">توضیحات اضافی <span class="opt">(اختیاری)</span></label>
                        <div class="textarea-wrap">
                            <textarea id="additionalNotes" name="additionalNotes" rows="3" data-rtl-listener="true"></textarea>
                            <button type="button" class="pin-attachment" id="pinAttachment" title="افزودن فایل">
                                <i class="fas fa-paperclip"></i>
                            </button>
                        </div>
                        <div class="file-preview" id="attachmentPreview"></div>
                        <input type="file" id="attachmentFile" accept="image/*,.pdf" style="display: none;">
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">ثبت درخواست</button>
            </form>
        </div>
    </main>
    <script src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var userData = JSON.parse(localStorage.getItem('userData') || 'null');
            const form = document.getElementById('articlesResearchForm');
            setupPriceInputFormatting(document.getElementById('proposedPrice'));
            function getAttachmentMetadata() {
                return (window.currentAttachments || []).map(function(attachment) {
                    return {
                        id: attachment.id,
                        name: attachment.name,
                        type: attachment.type,
                        size: attachment.size,
                        dataUrl: '',
                        uploadedAt: attachment.uploadedAt
                    };
                });
            }
            function saveRegistrationData(data, trackingCode) {
                localStorage.setItem('registrationData', JSON.stringify({
                    ...data,
                    attachments: getAttachmentMetadata()
                }));
                localStorage.setItem('lastTrackingCode', trackingCode);
            }
            if (form) {
                form.addEventListener('submit', async function(e) {
                    e.preventDefault();
                    const data = Object.fromEntries(new FormData(form));
                    
                    // Combine deadline fields
                    if (data.deadlineYear && data.deadlineMonth && data.deadlineDay) {
                        data.deadline = data.deadlineYear + '/' + data.deadlineMonth + '/' + data.deadlineDay;
                        delete data.deadlineYear;
                        delete data.deadlineMonth;
                        delete data.deadlineDay;
                    }
                    
                    data.serviceKey = 'articlesResearch';
                    data.serviceTitle = 'مقاله و تحقیق';
                    data.cost = 'قیمت توافقی - ' + document.getElementById('proposedPrice').value;
                    data.status = 'pending';
                    data.priceStatus = 'pending';
                    data.username = userData ? userData.username : null;
                    const uploadAttachments = Array.isArray(window.currentAttachments) ? window.currentAttachments : [];
                    data.attachments = uploadAttachments.map(attachmentForApiStorage);
                    try {
                        const response = await fetch('/api/order', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(data)
                        });
                        const result = await response.json();
                        await window.uploadAttachmentsForTrackingCode(result.trackingCode, uploadAttachments);
                        if (window.saveAttachmentsForTrackingCode && data.attachments.length > 0) {
                            await window.saveAttachmentsForTrackingCode(result.trackingCode, uploadAttachments);
                        }
                        saveRegistrationData(data, result.trackingCode);
                        window.location.href = 'success.html';
                    } catch (error) {
                        const fallbackCode = 'CFT-' + Date.now().toString().slice(-8);
                        await window.uploadAttachmentsForTrackingCode(fallbackCode, uploadAttachments);
                        if (window.saveAttachmentsForTrackingCode && data.attachments.length > 0) {
                            await window.saveAttachmentsForTrackingCode(fallbackCode, uploadAttachments);
                        }
                        saveRegistrationData(data, fallbackCode);
                        window.location.href = 'success.html';
                    }
                });
            }
        });
    </script>
</body>
</html>
