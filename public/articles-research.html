<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مقاله و تحقیق</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <a href="index.html" class="logo-icon" title="صفحه اصلی">
            <i class="fas fa-mug-hot"></i>
        </a>
        <header>
            <h1>مقاله و تحقیق</h1>
        </header>
        <main>
            <form id="articlesResearchForm" class="form-card">
                <div class="form-group">
                    <label for="researchType">نوع خدمات</label>
                    <select id="researchType" name="researchType" required>
                        <option value="">انتخاب کنید...</option>
                        <option value="article">نوشتن مقاله</option>
                        <option value="research">تحقیق علمی</option>
                        <option value="translation">ترجمه مقالات</option>
                        <option value="editing">ویرایش مقالات</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="subject">رشته / موضوع</label>
                    <input type="text" id="subject" name="subject" required>
                </div>

                <div class="form-group">
                    <label for="academicLevel">سطح تحصیلی</label>
                    <select id="academicLevel" name="academicLevel" required>
                        <option value="">انتخاب کنید...</option>
                        <option value="bachelor">کارشناسی</option>
                        <option value="master">کارشناسی ارشد</option>
                        <option value="phd">دکتری</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="pagesCount">تعداد صفحات</label>
                    <input type="number" id="pagesCount" name="pagesCount" min="1" required>
                </div>

                <div class="form-group">
                    <label for="deadline">مهلت تحویل</label>
                    <input type="date" id="deadline" name="deadline" required>
                </div>

                <div class="form-group">
                    <label for="customerName">نام و نام خانوادگی</label>
                    <input type="text" id="customerName" name="customerName" required>
                </div>

                <div class="form-group">
                    <label for="customerPhone">شماره تلفن</label>
                    <input type="tel" id="customerPhone" name="customerPhone" placeholder="09xx-xxx-xxxx" required>
                </div>
                <div class="info-item"><strong>قیمت خدمات:</strong> <span class="cost-value" id="displayCost">در حال بارگذاری...</span></div>
                <button type="submit" class="btn-next">ثبت درخواست</button>
            </form>
        </main>
    </div>
    <link rel="stylesheet" href="fonts/all.css">
    <script src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            fetch('/api/pricing')
                .then(function(r) { return r.json(); })
                .then(function(pricing) {
                    var pricingMap = {};
                    pricing.forEach(function(p) { pricingMap[p.service] = p.price; });
                    var price = pricingMap['articlesResearch'];
                    var displayCost = document.getElementById('displayCost');
                    if (displayCost) {
                        displayCost.textContent = price ? price.toLocaleString('fa-IR') + ' تومان' : 'قیمت توسط مدیر تنظیم نشده';
                    }
                })
                .catch(function() {
                    var displayCost = document.getElementById('displayCost');
                    if (displayCost) {
                        displayCost.textContent = 'قیمت توسط مدیر تنظیم نشده';
                    }
                });
            
            const form = document.getElementById('articlesResearchForm');
            if (form) {
                form.addEventListener('submit', function(e) {
                    e.preventDefault();
                    const data = Object.fromEntries(new FormData(form));
                    data.serviceKey = 'articlesResearch';
                    data.serviceTitle = 'مقاله و تحقیق';
                    data.cost = document.getElementById('displayCost').textContent;
                    localStorage.setItem('registrationData', JSON.stringify(data));
                    window.location.href = 'review.html';
                });
            }
        });
    </script>
</body>
</html>
