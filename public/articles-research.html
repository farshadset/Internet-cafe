<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مقاله و تحقیق</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="fonts/all.css">
    <link rel="stylesheet" href="libs/notie.min.css">
</head>
<body>
    <header class="site">
        <div class="container header-row">
            <a class="btn btn-ghost back-link" href="javascript:void(0)" onclick="document.referrer ? history.back() : window.location='/'">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                <span>بازگشت به صفحه اصلی</span>
            </a>
        </div>
    </header>
    <main>
        <div class="container">
            <form id="articlesResearchForm" class="form-card order-form">
                <div class="card-strip"></div>
                <div class="f-grid">
                    <div class="f-field">
                        <label for="customerName">نام و نام خانوادگی</label>
                        <input type="text" id="customerName" name="customerName" required>
                    </div>

                    <div class="f-field">
                        <label for="customerPhone">شماره تلفن</label>
                        <input type="tel" id="customerPhone" name="customerPhone" placeholder="09123456789" value="09123456789" required class="phone-default" style="direction:ltr;text-align:left;color:#999;font-weight:400" onfocus="if(this.value==='09123456789'){this.value='';this.style.color='#122A33';this.style.fontWeight='400'}" onblur="if(!this.value){this.value='09123456789';this.style.color='#999';this.style.fontWeight='400'}">
                    </div>

                    <div class="f-field">
                        <label for="researchType">نوع خدمات</label>
                        <select id="researchType" name="researchType" required>
                            <option value="">انتخاب کنید...</option>
                            <option value="article">نوشتن مقاله</option>
                            <option value="research">تحقیق علمی</option>
                            <option value="translation">ترجمه مقالات</option>
                            <option value="editing">ویرایش مقالات</option>
                        </select>
                    </div>

                    <div class="f-field">
                        <label for="subject">رشته / موضوع</label>
                        <input type="text" id="subject" name="subject" required>
                    </div>

                    <div class="f-field">
                        <label for="academicLevel">سطح تحصیلی</label>
                        <select id="academicLevel" name="academicLevel" required>
                            <option value="">انتخاب کنید...</option>
                            <option value="bachelor">کارشناسی</option>
                            <option value="master">کارشناسی ارشد</option>
                            <option value="phd">دکتری</option>
                        </select>
                    </div>

                    <div class="f-field">
                        <label for="pagesCount">تعداد صفحات</label>
                        <input type="number" id="pagesCount" name="pagesCount" min="1" required>
                    </div>

                    <div class="f-field">
                        <label for="proposedPrice">قیمت پیشنهادی (تومان)</label>
                        <input type="text" id="proposedPrice" name="proposedPrice" placeholder="قیمت مورد نظر خود را وارد کنید" required>
                        <small class="small">قیمت وارد شده بررسی و تایید یا اصلاح توسط مدیر خواهد شد</small>
                    </div>

                    <div class="f-field">
                        <label>مهلت تحویل</label>
                        <div style="display:flex;gap:0.25rem;align-items:center;flex-direction:row-reverse;direction:rtl;">
                            <input type="number" id="deadlineYear" name="deadlineYear" placeholder="سال" min="1400" max="1500" style="width:4rem;padding:0.25rem;">
                            <span style="color:#666;">/</span>
                            <input type="number" id="deadlineMonth" name="deadlineMonth" placeholder="ماه" min="1" max="12" style="width:3rem;padding:0.25rem;" onkeyup="if(this.value.length>=2)document.getElementById('deadlineYear').focus()">
                            <span style="color:#666;">/</span>
                            <input type="number" id="deadlineDay" name="deadlineDay" placeholder="روز" min="1" max="31" style="width:3rem;padding:0.25rem;" onkeyup="if(this.value.length>=2)document.getElementById('deadlineMonth').focus()">
                        </div>
                    </div>

                    <div class="f-field full">
                        <label for="additionalNotes">توضیحات اضافی <span class="opt">(اختیاری)</span></label>
                        <div class="textarea-wrap">
                            <textarea id="additionalNotes" name="additionalNotes" rows="3" data-rtl-listener="true"></textarea>
                            <button type="button" class="attach-btn" onclick="document.getElementById('attachmentFile').click()" title="افزودن فایل"><i class="fas fa-paperclip"></i></button>
                        </div>
                        <div class="file-preview" id="attachmentPreview"></div>
                        <input type="file" id="attachmentFile" accept="image/*,.heic,.heif,.pdf" style="display: none;">
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">ثبت درخواست</button>
            </form>
        </div>
    </main>
    <script src="libs/browser-image-compression.js"></script>
    <script src="libs/utils.js"></script>
    <script src="libs/notie.min.js"></script>
    <script src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var userData = JSON.parse(localStorage.getItem('userData') || 'null');
            const form = document.getElementById('articlesResearchForm');
            setupPriceInputFormatting(document.getElementById('proposedPrice'));
            var attachmentFile = document.getElementById('attachmentFile');
            var attachmentPreview = document.getElementById('attachmentPreview');
            window.currentAttachments = window.currentAttachments || [];
            var escapeHtml = ChillUtils.escapeHtml;
            if(attachmentFile && attachmentPreview){
                attachmentFile.addEventListener('change', function(e){
                    var file = e.target.files[0];
                    if(!file) return;
                    if(file.type.startsWith('image/') && window.currentAttachments.filter(function(a){return a.type&&a.type.startsWith('image/');}).length>=4){ChillUtils.showAlert('فقط می توان چهار فایل آپلود کرد');attachmentFile.value='';return;}
                    if(file.type==='application/pdf' && window.currentAttachments.filter(function(a){return a.type==='application/pdf';}).length>=4){ChillUtils.showAlert('فقط می توان چهار فایل آپلود کرد');attachmentFile.value='';return;}
                    var id = ChillUtils.generateId('att_');
                    var isImage=file.type.startsWith('image/');
                    var thumb=document.createElement('div');
                    thumb.className='file-thumb uploading';
                    thumb.dataset.id=id;
                    var progressOverlay='<div class="upload-progress-overlay">'
                        +'<svg class="upload-progress-ring" width="36" height="36" viewBox="0 0 36 36">'
                        +'<circle cx="18" cy="18" r="14" fill="none" stroke="#e5e7eb" stroke-width="3"/>'
                        +'<circle class="upload-progress-circle" data-progress-ring="'+id+'" cx="18" cy="18" r="14" fill="none" stroke="var(--firouzeh)" stroke-width="3" stroke-dasharray="87.96" stroke-dashoffset="87.96" transform="rotate(-90 18 18)" stroke-linecap="round"/>'
                        +'</svg>'
                        +'<span class="upload-progress-text" data-progress-text="'+id+'">0%</span>'
                        +'</div>'
                        +'<button type="button" class="upload-cancel-btn" data-cancel-reader="'+id+'"><i class="fas fa-times"></i></button>';
                    if(isImage){
                        thumb.innerHTML='<img src="" style="opacity:0.3">'+progressOverlay;
                    } else {
                        thumb.innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;background:#f0f0f0;font-size:10px;color:#666;text-align:center;padding:4px;opacity:0.3">'+escapeHtml(file.name)+'</div>'+progressOverlay;
                    }
                    attachmentPreview.appendChild(thumb);
                    thumb.querySelector('[data-cancel-reader="'+id+'"]').addEventListener('click',function(){
                        if(window._formActiveReaders&&window._formActiveReaders[id]){window._formActiveReaders[id].abort();delete window._formActiveReaders[id];}
                        window.currentAttachments=window.currentAttachments.filter(function(a){return a.id!==id});
                        thumb.remove();
                    });
                    if(!window._formActiveReaders) window._formActiveReaders={};
                    if(isImage){
                        var pv=new FileReader();
                        pv.onload=function(ev2){var img=thumb.querySelector('img');if(img){img.src=ev2.target.result;img.style.opacity='1';}};
                        pv.readAsDataURL(file);
                    }
                    var reader=new FileReader();
                    window._formActiveReaders[id]=reader;
                    reader.onprogress=function(ev){
                        if(ev.lengthComputable){
                            var pct=Math.round((ev.loaded/ev.total)*100);
                            var circle=document.querySelector('[data-progress-ring="'+id+'"]');
                            var text=document.querySelector('[data-progress-text="'+id+'"]');
                            if(circle)circle.style.strokeDashoffset=(87.96*(1-pct/100));
                            if(text)text.textContent=pct+'%';
                        }
                    };
                    reader.onload=function(ev){
                        thumb.classList.remove('uploading');
                        var ov=thumb.querySelector('.upload-progress-overlay');if(ov)ov.remove();
                        var cb=thumb.querySelector('.upload-cancel-btn');if(cb)cb.remove();
                        if(isImage){var imgEl=thumb.querySelector('img');if(imgEl){imgEl.src=ev.target.result;imgEl.style.opacity='1';}}
                        var nd=document.createElement('div');nd.className='file-name';nd.textContent=file.name;thumb.appendChild(nd);
                        var st=document.createElement('span');st.className='upload-status';st.innerHTML='<i class="fas fa-check"></i>';thumb.appendChild(st);
                        var rb=document.createElement('button');rb.type='button';rb.className='file-remove';rb.innerHTML='&times;';
                        rb.addEventListener('click',function(){window._removeSpecialAttach(id);});thumb.appendChild(rb);
                        window.currentAttachments.push({id:id,name:file.name,type:file.type,size:file.size,dataUrl:ev.target.result,uploadedAt:new Date().toISOString()});
                        delete window._formActiveReaders[id];
                    };
                    reader.onerror=function(){
                        thumb.classList.remove('uploading');
                        var ov=thumb.querySelector('.upload-progress-overlay');if(ov)ov.remove();
                        var cb=thumb.querySelector('.upload-cancel-btn');if(cb)cb.remove();
                        var rb=document.createElement('button');rb.type='button';rb.className='file-remove';rb.innerHTML='&times;';
                        rb.addEventListener('click',function(){window._removeSpecialAttach(id);});thumb.appendChild(rb);
                        delete window._formActiveReaders[id];
                    };
                    reader.readAsDataURL(file);
                    attachmentFile.value='';
                });
            }
            window._removeSpecialAttach = function(id){
                window.currentAttachments = window.currentAttachments.filter(function(a){return a.id!==id});
                var thumb=document.querySelector('.file-thumb[data-id="'+id+'"]');
                if(thumb) thumb.remove();
            };
            function getAttachmentMetadata() {
                return (window.currentAttachments || []).map(function(attachment) {
                    return {
                        id: attachment.id,
                        name: attachment.name,
                        type: attachment.type,
                        size: attachment.size,
                        dataUrl: '',
                        uploadedAt: attachment.uploadedAt
                    };
                });
            }
            function saveRegistrationData(data, trackingCode) {
                localStorage.setItem('registrationData', JSON.stringify({
                    ...data,
                    attachments: getAttachmentMetadata()
                }));
                localStorage.setItem('lastTrackingCode', trackingCode);
            }
            if (form) {
                form.addEventListener('submit', async function(e) {
                    e.preventDefault();
                    const submitBtn = form.querySelector('[type="submit"]');
                    if (submitBtn && submitBtn.disabled) return;
                    const data = Object.fromEntries(new FormData(form));
                    
                    // Combine deadline fields
                    if (data.deadlineYear && data.deadlineMonth && data.deadlineDay) {
                        data.deadline = data.deadlineYear + '/' + data.deadlineMonth + '/' + data.deadlineDay;
                        delete data.deadlineYear;
                        delete data.deadlineMonth;
                        delete data.deadlineDay;
                    }
                    
                    data.serviceKey = 'articlesResearch';
                    data.serviceTitle = 'مقاله و تحقیق';
                    data.cost = 'قیمت توافقی - ' + document.getElementById('proposedPrice').value;
                    data.status = 'pending';
                    data.priceStatus = 'pending';
                    data.username = userData ? userData.username : null;
                    const uploadAttachments = Array.isArray(window.currentAttachments) ? window.currentAttachments : [];
                    data.attachments = uploadAttachments.map(attachmentForApiStorage);
                    if (submitBtn) { submitBtn.disabled = true; submitBtn.textContent = 'در حال ارسال...'; }
                    try {
                        const response = await fetch('/api/order', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(data)
                        });
                        const result = await response.json();
                        if (!response.ok || !result.trackingCode) {
                            ChillUtils.showAlert(result.error || 'خطا در ثبت سفارش', 'error');
                            if (submitBtn) { submitBtn.disabled = false; submitBtn.textContent = 'ثبت سفارش'; }
                            return;
                        }
                        await window.uploadAttachmentsForTrackingCode(result.trackingCode, uploadAttachments);
                        if (window.saveAttachmentsForTrackingCode && data.attachments.length > 0) {
                            await window.saveAttachmentsForTrackingCode(result.trackingCode, uploadAttachments);
                        }
                        saveRegistrationData(data, result.trackingCode);
                        window.location.href='/success';
                    } catch (error) {
                        ChillUtils.showAlert('خطا در اتصال به سرور', 'error');
                        if (submitBtn) { submitBtn.disabled = false; submitBtn.textContent = 'ثبت سفارش'; }
                    }
                });
            }
        });
    </script>
</body>
</html>
