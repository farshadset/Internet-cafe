    <div class="container">
        <main>
            <div style="max-width:480px;margin:0 auto;display:flex;justify-content:flex-start;margin-bottom:0.5rem;">
                <a class="btn btn-ghost back-link" href="#" id="backBtn">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"></path></svg>
                    <span>بازگشت</span>
                </a>
            </div>
            <div class="form-card">
                <div class="form-group">
                    <label for="socialWhatsapp">لینک واتساپ</label>
                    <input type="text" id="socialWhatsapp" placeholder="https://wa.me/98912..." style="direction: ltr; text-align: left;">
                </div>
                <div class="form-group">
                    <label for="socialTelegram">لینک تلگرام</label>
                    <input type="text" id="socialTelegram" placeholder="https://t.me/..." style="direction: ltr; text-align: left;">
                </div>
                <div class="form-group">
                    <label for="socialBale">لینک بله</label>
                    <input type="text" id="socialBale" placeholder="https://ble.ir/..." style="direction: ltr; text-align: left;">
                </div>
                <div class="form-group">
                    <label for="socialRobika">لینک روبیکا</label>
                    <input type="text" id="socialRobika" placeholder="https://rubika.ir/..." style="direction: ltr; text-align: left;">
                </div>
                <button id="saveSocialBtn" class="btn-confirm" style="width: 100%; margin-top: 10px;">ذخیره اطلاعات تماس</button>
                <div style="display:flex;justify-content:flex-end;margin-top:10px;">
                    <a class="btn btn-ghost back-link" href="#" id="backBtn2">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"></path></svg>
                        <span>بازگشت</span>
                    </a>
                </div>
            </div>
        </main>
    </div>
    <script src="libs/utils.js"></script>
    <script src="app.js"></script>
    <script>
        document.getElementById('backBtn') && document.getElementById('backBtn').addEventListener('click', function(e) { e.preventDefault(); document.referrer ? history.back() : window.location = '/admin'; });
        document.getElementById('backBtn2') && document.getElementById('backBtn2').addEventListener('click', function(e) { e.preventDefault(); document.referrer ? history.back() : window.location = '/admin'; });
        (function(){ if (!checkAdminAuth()) return; })();
        document.addEventListener('DOMContentLoaded', function() {
            // Sidebar toggle
            var sidebar = document.getElementById('desktopSidebar');
            if(sidebar) {
                sidebar.addEventListener('mouseenter', function(){
                    sidebar.classList.add('expanded');
                });
                sidebar.addEventListener('mouseleave', function(){
                    sidebar.classList.remove('expanded');
                });
            }

            var socialInputs = {
                whatsapp: document.getElementById('socialWhatsapp'),
                telegram: document.getElementById('socialTelegram'),
                bale: document.getElementById('socialBale'),
                robika: document.getElementById('socialRobika')
            };
            var saveBtn = document.getElementById('saveSocialBtn');

            // Load saved social links
            function loadSocialLinks() {
                var saved = localStorage.getItem('caffint_social_links');
                if (saved) {
                    try {
                        var data = JSON.parse(saved);
                        if (socialInputs.whatsapp) socialInputs.whatsapp.value = data.whatsapp || '';
                        if (socialInputs.telegram) socialInputs.telegram.value = data.telegram || '';
                        if (socialInputs.bale) socialInputs.bale.value = data.bale || '';
                        if (socialInputs.robika) socialInputs.robika.value = data.robika || '';
                    } catch(e) {}
                }
            }

            // Save social links
            if (saveBtn) {
                saveBtn.addEventListener('click', function() {
                    function addProtocol(url) {
                        if (url && !url.match(/^https?:\/\//i)) return 'https://' + url;
                        return url;
                    }
                    var data = {
                        whatsapp: addProtocol(socialInputs.whatsapp ? socialInputs.whatsapp.value.trim() : ''),
                        telegram: addProtocol(socialInputs.telegram ? socialInputs.telegram.value.trim() : ''),
                        bale: addProtocol(socialInputs.bale ? socialInputs.bale.value.trim() : ''),
                        robika: addProtocol(socialInputs.robika ? socialInputs.robika.value.trim() : '')
                    };
                    try {
                        localStorage.setItem('caffint_social_links', JSON.stringify(data));
                        showToast('اطلاعات تماس با موفقیت ذخیره شد');
                    } catch(e) {
                        ChillUtils.showAlert('خطا در ذخیره اطلاعات', 'error');
                    }
                });
            }

            var showToast = ChillUtils.showToast;

            loadSocialLinks();

            // Load social links into sidebar
            var savedSocial = localStorage.getItem('caffint_social_links');
            if (savedSocial) {
                try {
                    var socialData = JSON.parse(savedSocial);
                    var socialLinks = document.querySelectorAll('.sidebar-social a');
                    socialLinks.forEach(function(link) {
                        var title = link.getAttribute('title');
                        if (title === 'واتساپ' && socialData.whatsapp) link.href = socialData.whatsapp;
                        else if (title === 'تلگرام' && socialData.telegram) link.href = socialData.telegram;
                        else if (title === 'بله' && socialData.bale) link.href = socialData.bale;
                        else if (title === 'روبیکا' && socialData.robika) link.href = socialData.robika;
                    });
                } catch(e) {}
            }
        });
    </script>
</body>
</html>
