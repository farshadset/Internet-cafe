<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قیمت‌گذاری</title>
    <script src="libs/utils.js"></script>
    <script src="libs/notie.min.js"></script>
    <script>
        (function(){ if (!checkAdminAuth()) return; })();
    </script>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="stylesheet" href="fonts/all.css">
    <link rel="stylesheet" href="libs/notie.min.css">
</head>
<body>
    <div class="container">
        <main>
            <div style="max-width:480px;margin:0 auto;display:flex;justify-content:flex-end;margin-bottom:0.5rem;">
                <a class="btn btn-ghost back-link" href="javascript:void(0)" onclick="document.referrer ? history.back() : window.location='/admin'">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"></path></svg>
                    <span>بازگشت</span>
                </a>
            </div>
            <div class="form-card" id="pricingContainer">
                <p style="text-align:center;color:#999;">بارگذاری...</p>
            </div>
        </main>
    </div>

    <div class="pricing-save-bar" id="saveBar">
        <span class="save-count"><strong id="dirtyCount">0</strong> ذخیره نشده</span>
        <button class="btn-cancel-changes" id="cancelBtn">انصراف</button>
        <button class="btn-save-all" id="saveAllBtn">ذخیره همه</button>
    </div>

    <script src="libs/pricing-catalog.js"></script>
    <script src="libs/utils.js"></script>
    <script src="app.js"></script>
    <script>
        (function(){ if (!checkAdminAuth()) return; })();
        var formatPrice = ChillUtils.formatPrice;
        var escapeHtml = ChillUtils.escapeHtml;
        var Catalog = PricingCatalog;
        var CATALOG = Catalog.CATALOG;

        document.addEventListener('DOMContentLoaded', function() {
            var container = document.getElementById('pricingContainer');
            var saveBar = document.getElementById('saveBar');
            var dirtyCountEl = document.getElementById('dirtyCount');
            var saveAllBtn = document.getElementById('saveAllBtn');
            var cancelBtn = document.getElementById('cancelBtn');

            var state = { expandedCategories: {}, expandedGroups: {} };
            var pricingMap = {};
            var originals = {};
            var dirty = {};

            function stripCommas(s) { return s.replace(/,/g, ''); }

            function formatInputNumber(val) {
                var raw = stripCommas(val);
                if (!/^\d*$/.test(raw)) return '';
                if (raw === '') return '';
                return parseInt(raw, 10).toLocaleString('en');
            }

            function updateSaveBar() {
                var count = Object.keys(dirty).length;
                dirtyCountEl.textContent = count;
                saveBar.classList.toggle('visible', count > 0);
            }

            function markDirty(key, input) {
                var orig = originals[key];
                var current = stripCommas(input.value);
                if (current === orig) {
                    delete dirty[key];
                    input.classList.remove('dirty');
                } else {
                    dirty[key] = current;
                    input.classList.add('dirty');
                }
                updateSaveBar();
            }

            function renderPricing() {
                container.innerHTML = '';
                Object.keys(CATALOG).forEach(function(category) {
                    var catExpanded = !!state.expandedCategories[category];
                    var catDiv = document.createElement('div');
                    catDiv.className = 'pricing-category';
                    var header = document.createElement('div');
                    header.className = 'category-header';
                    header.innerHTML = '<span>' + category + '</span>' +
                        '<i class="fas fa-chevron-left" style="transform:' + (catExpanded ? 'rotate(-90deg)' : '') + ';"></i>';
                    header.addEventListener('click', function() {
                        state.expandedCategories[category] = !state.expandedCategories[category];
                        renderPricing();
                    });
                    catDiv.appendChild(header);

                    if (catExpanded) {
                        var body = document.createElement('div');
                        body.className = 'category-body';
                        var services = CATALOG[category].services || {};
                        Object.keys(services).forEach(function(serviceName) {
                            var service = services[serviceName];
                            var groupKey = category + '||' + serviceName;
                            var grpExpanded = !!state.expandedGroups[groupKey];

                            var groupDiv = document.createElement('div');
                            groupDiv.className = 'pricing-group';

                            var groupHeader = document.createElement('div');
                            groupHeader.className = 'group-header';

                            groupHeader.innerHTML = '<span>' + serviceName + '</span>' +
                                '<i class="fas fa-chevron-left" style="transform:' + (grpExpanded ? 'rotate(-90deg)' : '') + ';"></i>';
                            groupHeader.addEventListener('click', function(e) {
                                e.stopPropagation();
                                state.expandedGroups[groupKey] = !state.expandedGroups[groupKey];
                                renderPricing();
                            });
                            groupDiv.appendChild(groupHeader);

                            if (grpExpanded && service.subServices) {
                                Object.keys(service.subServices).forEach(function(subName) {
                                    var subKey = service.subServices[subName];
                                    var currentPrice = pricingMap[subKey];

                                    var serviceDiv = document.createElement('div');
                                    serviceDiv.className = 'pricing-service-item';

                                    var inputId = 'price-' + subKey;
                                    var displayVal = (currentPrice !== undefined && currentPrice !== null)
                                        ? formatInputNumber(String(currentPrice)) : '';

                                    serviceDiv.innerHTML =
                                        '<div class="service-info">' +
                                            '<span class="service-title">' + escapeHtml(subName) + '</span>' +
                                            '<span class="service-price' + (currentPrice ? ' has-price' : '') + '">' +
                                                (currentPrice ? formatPrice(currentPrice) + ' تومان' : '<span class="price-empty">قیمت تعیین نشده</span>') +
                                            '</span>' +
                                        '</div>' +
                                        '<input type="text" class="pricing-input" inputmode="numeric" ' +
                                            'placeholder="' + (currentPrice || 0) + '" ' +
                                            'value="' + displayVal + '" ' +
                                            'data-key="' + subKey + '" id="' + inputId + '">';

                                    var input = serviceDiv.querySelector('.pricing-input');

                                    originals[subKey] = stripCommas(displayVal);
                                    if (dirty[subKey] !== undefined) {
                                        input.classList.add('dirty');
                                    } else {
                                        delete dirty[subKey];
                                    }

                                    input.addEventListener('input', function() {
                                        var pos = this.selectionStart;
                                        var oldLen = this.value.length;
                                        this.value = formatInputNumber(this.value);
                                        if (this.value !== oldLen) {
                                            var diff = this.value.length - oldLen;
                                            this.setSelectionRange(pos + diff, pos + diff);
                                        }
                                        markDirty(subKey, this);
                                    });

                                    groupDiv.appendChild(serviceDiv);
                                });
                            }
                            body.appendChild(groupDiv);
                        });
                        catDiv.appendChild(body);
                    }
                    container.appendChild(catDiv);
                });
                updateSaveBar();
            }

            saveAllBtn.addEventListener('click', function() {
                var keys = Object.keys(dirty);
                if (keys.length === 0) return;
                saveAllBtn.disabled = true;

                var items = keys.map(function(key) {
                    return { service: key, price: parseInt(stripCommas(dirty[key])) || 0 };
                });

                fetch('/api/pricing/bulk', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(items)
                })
                .then(function(r) { return r.json().then(function(d) { return { ok: r.ok, data: d }; }); })
                .then(function(result) {
                    if (result.ok && result.data.success) {
                        keys.forEach(function(key) {
                            pricingMap[key] = parseInt(stripCommas(dirty[key])) || 0;
                        });
                        dirty = {};
                        originals = {};
                        renderPricing();
                        ChillUtils.showAlert(result.data.count + ' قیمت با موفقیت ذخیره شد', 'success');
                    } else {
                        ChillUtils.showAlert(result.data.error || 'خطا در ذخیره قیمت‌ها', 'error');
                    }
                    saveAllBtn.disabled = false;
                })
                .catch(function() {
                    ChillUtils.showAlert('خطا در ارتباط با سرور.', 'error');
                    saveAllBtn.disabled = false;
                });
            });

            cancelBtn.addEventListener('click', function() {
                dirty = {};
                originals = {};
                renderPricing();
            });

            fetch('/api/pricing?t=' + Date.now())
                .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
                .then(function(pricing) {
                    pricing.forEach(function(p) { pricingMap[p.service] = p.price; });
                    renderPricing();
                })
                .catch(function() {
                    container.innerHTML = '<p style="text-align:center;color:red;">خطا در بارگذاری قیمت‌ها.</p>';
                });
        });
    </script>
</body>
</html>
