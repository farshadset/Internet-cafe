<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سهام عدالت</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <a href="index.html" class="logo-icon" title="صفحه اصلی">
            <i class="fas fa-mug-hot"></i>
        </a>
        <header>
            <h1>سهام عدالت</h1>
        </header>
        <main>
            <form id="serviceForm" class="form-card" data-service="justice-stocks">
                <div class="form-group">
                    <label for="actionType">نوع درخواست</label>
                    <select id="actionType" name="actionType" required>
                        <option value="">انتخاب کنید</option>
                        <option value="register">ثبت نام سهام عدالت</option>
                        <option value="inquiry">استعلام سهام</option>
                        <option value="sell">فروش سهام</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="applicantPhone">شماره تلفن همراه</label>
                    <input type="tel" id="applicantPhone" name="applicantPhone" placeholder="09xx-xxx-xxxx" required>
                </div>
                <div class="form-group">
                    <label for="applicantNationalId">کد ملی</label>
                    <input type="text" id="applicantNationalId" name="applicantNationalId" maxlength="10" required>
                </div>
                <div class="form-group">
                    <label>تاریخ تولد</label>
                    <div class="date-fields">
                        <input type="number" id="birthYear" name="birthYear" placeholder="سال" min="1300" max="1500">
                        <input type="number" id="birthMonth" name="birthMonth" placeholder="ماه" min="1" max="12">
                        <input type="number" id="birthDay" name="birthDay" placeholder="روز" min="1" max="31">
                    </div>
                </div>
                <div class="form-group" id="sellFields" style="display:none;">
                    <label for="stockCount">تعداد سهام</label>
                    <input type="number" id="stockCount" name="stockCount" min="1">
                    <label for="sellPrice" style="margin-top:10px;">قیمت فروش (تومان)</label>
                    <input type="text" id="sellPrice" name="sellPrice" placeholder="مثلاً ۱,۰۰۰,۰۰۰">
                </div>
                <div class="form-group">
                    <label for="additionalNotes">توضیحات اضافی</label>
                    <textarea id="additionalNotes" name="additionalNotes" rows="3"></textarea>
                </div>
                <button type="submit" class="btn-next">ثبت درخواست</button>
            </form>
        </main>
    </div>
    <link rel="stylesheet" href="fonts/all.css">
    <script src="app.js"></script>
    <script>
        document.getElementById('actionType').addEventListener('change', function() {
            document.getElementById('sellFields').style.display = this.value === 'sell' ? 'block' : 'none';
        });
    </script>
</body>
</html>
