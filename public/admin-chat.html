<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        (function(){
            try{
                var d=JSON.parse(localStorage.getItem('adminData')||'null');
                if(!d||!d.token){location.replace('login.html');return;}
                var parts=d.token.split('.');
                if(parts.length===3){
                    var payload=JSON.parse(atob(parts[1].replace(/-/g,'+').replace(/_/g,'/')));
                    if(payload.exp && Date.now()>payload.exp){localStorage.removeItem('adminData');location.replace('login.html');return;}
                }
            }catch(e){location.replace('login.html');return;}
        })();
    </script>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="stylesheet" href="fonts/all.css">
    <style>
        .customer-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .customer-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 1rem;
            background: #fff;
            border-radius: 12px;
            border: 1px solid #e9ecef;
            text-decoration: none;
            color: inherit;
            transition: background 0.2s;
        }
        .customer-item:hover {
            background: #f5f7ff;
        }
        .avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #667eea;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.1rem;
            flex-shrink: 0;
        }
        .customer-info {
            flex: 1;
            min-width: 0;
        }
        .customer-name {
            font-weight: 700;
            font-size: 0.95rem;
            margin-bottom: 0.15rem;
        }
        .customer-last-msg {
            font-size: 0.85rem;
            color: #666;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            direction: rtl;
        }
        .badge {
            background: #e74c3c;
            color: white;
            font-size: 0.7rem;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 10px;
            min-width: 22px;
            text-align: center;
        }
        .empty-state {
            text-align: center;
            color: #999;
            padding: 3rem 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <main>
            <div style="max-width:480px;margin:0 auto;display:flex;justify-content:flex-start;margin-bottom:0.5rem;">
                <a class="btn btn-ghost back-link" href="admin.html">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"></path></svg>
                    <span>بازگشت</span>
                </a>
            </div>
            <div class="form-card">
                <div class="customer-list" id="customersList">
                    <p class="empty-state">در حال بارگذاری...</p>
                </div>
            </div>
        </main>
    </div>
    <script src="app.js"></script>
    <script>
        (function(){
            try{
                var d=JSON.parse(localStorage.getItem('adminData')||'null');
                if(!d||!d.token){window.location.href='login.html';return;}
                var parts=d.token.split('.');
                if(parts.length===3){
                    var payload=JSON.parse(atob(parts[1].replace(/-/g,'+').replace(/_/g,'/')));
                    if(payload.exp && Date.now()>payload.exp){localStorage.removeItem('adminData');window.location.href='login.html';return;}
                }
            }catch(e){window.location.href='login.html';return;}
        })();
        document.addEventListener('DOMContentLoaded', function() {
            var listEl = document.getElementById('customersList');

            window.loadCustomers = function() {
                listEl.innerHTML = '<p class="empty-state">در حال بارگذاری...</p>';
                fetch('/api/admin/chat/customers')
                    .then(function(r) {
                        if (r.status === 401) { localStorage.removeItem('adminData'); window.location.href = 'login.html'; return; }
                        if (!r.ok) throw new Error('HTTP ' + r.status);
                        return r.json();
                    })
                    .then(function(customers) {
                        listEl.innerHTML = '';
                        if (!customers || customers.length === 0) {
                            listEl.innerHTML = '<p class="empty-state">هیچ مشتری پیامی ندارد</p>';
                            return;
                        }
                        customers.forEach(function(c) {
                            var a = document.createElement('a');
                            a.href = 'admin-chat-conversation.html?username=' + encodeURIComponent(c.username);
                            a.className = 'customer-item';
                            var initial = (c.username || '?')[0];
                            a.innerHTML =
                                '<div class="avatar">' + escapeHtml(initial) + '</div>' +
                                '<div class="customer-info">' +
                                    '<div class="customer-name">' + escapeHtml(c.username || 'مهمان') + '</div>' +
                                    '<div class="customer-last-msg">' + escapeHtml(c.lastMessage || '') + '</div>' +
                                '</div>' +
                                (c.unread > 0 ? '<span class="badge">' + parseInt(c.unread, 10) + '</span>' : '');
                            listEl.appendChild(a);
                        });
                    })
                    .catch(function() {
                        listEl.innerHTML = '<p class="empty-state" style="color:red;">خطا در بارگذاری</p><p class="empty-state"><button onclick="loadCustomers()" style="padding:8px 20px;border:none;background:#667eea;color:#fff;border-radius:8px;cursor:pointer;font-size:0.9rem;">تلاش مجدد</button></p>';
                    });
            };

            loadCustomers();
        });
    </script>
</body>
</html>
