<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تراکنش‌های مالی</title>
    <script src="libs/utils.js"></script>
    <script src="libs/notie.min.js"></script>
    <script>
        (function(){ if (!checkAdminAuth()) return; })();
    </script>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="stylesheet" href="fonts/all.css">
    <link rel="stylesheet" href="libs/notie.min.css">
</head>
<body>
    <div class="container">
        <main>
            <div style="max-width:480px;margin:0 auto;display:flex;justify-content:flex-start;margin-bottom:0.5rem;">
                <a class="btn btn-ghost back-link" href="javascript:void(0)" onclick="document.referrer ? history.back() : window.location='/admin'">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"></path></svg>
                    <span>بازگشت</span>
                </a>
            </div>
            <div class="form-card">
                <div style="display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:1rem;flex-wrap:wrap;">
                    <div class="status-btns" style="margin-bottom:0;" id="reportFilterTabs">
                        <button class="status-btn active" data-filter="daily" title="روزانه"><i class="fas fa-calendar-day"></i></button>
                        <button class="status-btn" data-filter="weekly" title="هفتگی"><i class="fas fa-calendar-week"></i></button>
                        <button class="status-btn" data-filter="monthly" title="ماهانه"><i class="fas fa-calendar-alt"></i></button>
                        <button class="status-btn" data-filter="all" title="همه"><i class="fas fa-list"></i></button>
                    </div>
                    <input type="text" id="txSearchInput" placeholder="جستجو (نام کاربری، کد سفارش، تاریخ)..." style="padding:8px 14px;border:1px solid #ddd;border-radius:8px;font-family:inherit;font-size:13px;width:260px;direction:rtl;" dir="auto">
                </div>
                <div id="reportSummary" style="display:flex;justify-content:center;gap:20px;margin-bottom:1rem;flex-wrap:wrap;"></div>
                <div id="transactionsList">
                    <p style="text-align:center;color:#999;">بارگذاری...</p>
                </div>
            </div>
        </main>
    </div>
    <script src="libs/browser-image-compression.js"></script>
    <script src="libs/utils.js"></script>
    <script src="app.js"></script>
    <script>
        (function(){ if (!checkAdminAuth()) return; })();
        document.addEventListener('DOMContentLoaded', function() {
            var container = document.getElementById('transactionsList');
            var summaryContainer = document.getElementById('reportSummary');
            var filterBtns = document.querySelectorAll('#reportFilterTabs .status-btn');
            var txSearchInput = document.getElementById('txSearchInput');
            var allOrders = [];
            var currentFilter = 'daily';
            var searchQuery = '';

            function getJalaliDate(dateStr) {
                if (!dateStr) return '-';
                var d = new Date(dateStr);
                return d.toLocaleDateString('fa-IR');
            }

            function getDateRange(filter) {
                var now = new Date();
                var start = new Date();
                if (filter === 'daily') {
                    start.setHours(0, 0, 0, 0);
                } else if (filter === 'weekly') {
                    start.setDate(now.getDate() - 6);
                    start.setHours(0, 0, 0, 0);
                } else if (filter === 'monthly') {
                    start.setMonth(now.getMonth() - 1);
                    start.setHours(0, 0, 0, 0);
                } else {
                    return null;
                }
                return start;
            }

            function getCompletedOrders() {
                return allOrders.filter(function(o) { return o.status === 'completed'; });
            }

            function filterByDate(orders, filter) {
                var startDate = getDateRange(filter);
                if (!startDate) return orders;
                return orders.filter(function(o) {
                    if (!o.created_at) return false;
                    return new Date(o.created_at) >= startDate;
                });
            }

            function renderSummary(orders) {
                var totalIncome = orders.reduce(function(sum, o) {
                    return sum + (parseInt(o.adminProposedPrice || o.proposedPrice || 0, 10) || 0);
                }, 0);
                var count = orders.length;
                summaryContainer.innerHTML =
                    '<div style="background:#e8f5e9;padding:12px 20px;border-radius:10px;text-align:center;min-width:140px;">' +
                    '<div style="font-size:12px;color:#666;">تعداد تراکنش</div>' +
                    '<div style="font-size:20px;font-weight:700;color:#2e7d32;">' + count + '</div>' +
                    '</div>' +
                    '<div style="background:#e3f2fd;padding:12px 20px;border-radius:10px;text-align:center;min-width:140px;">' +
                    '<div style="font-size:12px;color:#666;">مجموع درآمد</div>' +
                    '<div style="font-size:20px;font-weight:700;color:#1565c0;">' + totalIncome.toLocaleString('fa-IR') + ' تومان</div>' +
                    '</div>';
            }

            function renderTransactions(orders) {
                container.innerHTML = '';
                if (orders.length === 0) {
                    container.innerHTML = '<p style="text-align:center;color:#999;">تراکنشی یافت نشد.</p>';
                    return;
                }
                var sorted = orders.slice().sort(function(a, b) {
                    return new Date(b.created_at) - new Date(a.created_at);
                });
                var table = document.createElement('table');
                table.style.cssText = 'width:100%;border-collapse:collapse;text-align:center;font-size:14px;';
                var thead = document.createElement('thead');
                thead.innerHTML = '<tr style="background:#227164;color:#fff;">' +
                    '<th style="padding:12px 8px;border-radius:0 8px 8px 0;">تاریخ</th>' +
                    '<th style="padding:12px 8px;">کد سفارش</th>' +
                    '<th style="padding:12px 8px;">نام کاربری</th>' +
                    '<th style="padding:12px 8px;">خدمت</th>' +
                    '<th style="padding:12px 8px;border-radius:8px 0 0 8px;">مبلغ</th>' +
                    '</tr>';
                table.appendChild(thead);
                var tbody = document.createElement('tbody');
                var totalIncome = 0;
                sorted.forEach(function(order, index) {
                    var price = parseInt(order.adminProposedPrice || order.proposedPrice || 0, 10) || 0;
                    totalIncome += price;
                    var bgColor = index % 2 === 0 ? '#f8f9fa' : '#fff';
                    var tr = document.createElement('tr');
                    tr.style.cssText = 'background:' + bgColor + ';border-bottom:1px solid #eee;';
                    tr.innerHTML = '<td style="padding:10px 8px;">' + getJalaliDate(order.created_at) + '</td>' +
                        '<td style="padding:10px 8px;font-weight:600;">' + escapeHtml(order.trackingCode) + '</td>' +
                        '<td style="padding:10px 8px;">' + escapeHtml(order.username || '-') + '</td>' +
                        '<td style="padding:10px 8px;">' + escapeHtml(order.title || order.serviceKey || '-') + '</td>' +
                        '<td style="padding:10px 8px;font-weight:600;color:#2e7d32;">' + (price > 0 ? price.toLocaleString('fa-IR') + ' تومان' : '-') + '</td>';
                    tbody.appendChild(tr);
                });
                var totalRow = document.createElement('tr');
                totalRow.style.cssText = 'background:#e8f5e9;font-weight:700;';
                totalRow.innerHTML = '<td colspan="4" style="padding:12px 8px;border-radius:0 0 0 8px;">مجموع</td>' +
                    '<td style="padding:12px 8px;border-radius:0 0 8px 0;color:#2e7d32;">' + totalIncome.toLocaleString('fa-IR') + ' تومان</td>';
                tbody.appendChild(totalRow);
                table.appendChild(tbody);
                container.appendChild(table);
            }

            function normalizeDigits(str) {
                if (!str) return '';
                return str.replace(/[۰-۹]/g, function(d) { return String.fromCharCode(d.charCodeAt(0) - 1728); })
                          .replace(/[٠-٩]/g, function(d) { return String.fromCharCode(d.charCodeAt(0) - 1584); });
            }

            function render() {
                var completed = getCompletedOrders();
                var filtered = filterByDate(completed, currentFilter);
                if (searchQuery) {
                    var q = normalizeDigits(searchQuery);
                    filtered = filtered.filter(function(o) {
                        var dateStr = normalizeDigits(getJalaliDate(o.created_at));
                        return (o.username && o.username.includes(searchQuery)) ||
                               (o.trackingCode && o.trackingCode.includes(searchQuery)) ||
                               (dateStr && dateStr.includes(q));
                    });
                }
                renderSummary(filtered);
                renderTransactions(filtered);
            }

            filterBtns.forEach(function(btn) {
                btn.addEventListener('click', function() {
                    filterBtns.forEach(function(b) { b.classList.remove('active'); });
                    this.classList.add('active');
                    currentFilter = this.getAttribute('data-filter');
                    render();
                });
            });

            txSearchInput.addEventListener('input', function() {
                searchQuery = this.value.trim();
                render();
            });

            fetch('/api/orders')
                .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
                .then(function(orders) {
                    allOrders = orders;
                    render();
                })
                .catch(function() {
                    container.innerHTML = '<p style="text-align:center;color:red;">خطا در بارگذاری تراکنش‌ها.</p>';
                });
        });
    </script>
</body>
</html>
