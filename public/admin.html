    <script src="app.js" defer></script>
    <script>
        (function(){try{var d=JSON.parse(localStorage.getItem('adminData')||'null');if(!d||!d.token){window.location.href='login.html';return;}}catch(e){window.location.href='login.html';return;}})();
        document.addEventListener('DOMContentLoaded', function() {
            function toFa(n) { return n.toLocaleString('fa-IR'); }

            function updateStatusCounts(orders) {
                var pending = 0, processing = 0, completed = 0, totalIncome = 0;
                orders.forEach(function(o) {
                    if (o.status === 'pending') pending++;
                    else if (o.status === 'processing') processing++;
                    else if (o.status === 'completed') {
                        completed++;
                        totalIncome += parseInt(o.adminProposedPrice || o.proposedPrice || 0, 10) || 0;
                    }
                });
                document.getElementById('pendingCount').textContent = toFa(pending);
                document.getElementById('processingCount').textContent = toFa(processing);
                document.getElementById('completedCount').textContent = toFa(completed);
                document.getElementById('totalIncome').textContent = toFa(totalIncome);
            }

            fetch('/api/orders')
                .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
                .then(function(orders) {
                    updateStatusCounts(orders);
                })
                .catch(function() {});

            fetch('/api/admin/customers')
                .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
                .then(function(data) {
                    var badge = document.getElementById('customersBadge');
                    if (badge && data.totalCustomers > 0) {
                        badge.textContent = data.totalCustomers;
                        badge.style.display = 'inline-block';
                    }
                })
                .catch(function() {});

            // Sidebar toggle
            var sidebar = document.getElementById('desktopSidebar');
            if(sidebar) {
                sidebar.addEventListener('mouseenter', function(){
                    sidebar.classList.add('expanded');
                });
                sidebar.addEventListener('mouseleave', function(){
                    sidebar.classList.remove('expanded');
                });
            }

            // Load social links into sidebar
            var savedSocial = localStorage.getItem('caffint_social_links');
            if (savedSocial) {
                try {
                    var socialData = JSON.parse(savedSocial);
                    var socialLinks = document.querySelectorAll('.sidebar-social a');
                    socialLinks.forEach(function(link) {
                        var title = link.getAttribute('title');
                        if (title === 'واتساپ' && socialData.whatsapp) link.href = socialData.whatsapp;
                        else if (title === 'تلگرام' && socialData.telegram) link.href = socialData.telegram;
                        else if (title === 'بله' && socialData.bale) link.href = socialData.bale;
                        else if (title === 'روبیکا' && socialData.robika) link.href = socialData.robika;
                    });
                } catch(e) {}
            }

            // Biometric settings for admin
            var adminBiometricToggle = document.getElementById('adminBiometricToggle');
            var adminBiometricSection = document.getElementById('adminBiometricSection');
            var adminBiometricStatus = document.getElementById('adminBiometricStatus');
            var adminBiometricList = document.getElementById('adminBiometricList');
            var addAdminBiometricBtn = document.getElementById('addAdminBiometricBtn');

            if (WebAuthnClient && WebAuthnClient.isSupported()) {
                WebAuthnClient.isPlatformAuthenticatorAvailable().then(function(available) {
                    if (available) {
                        adminBiometricToggle.style.display = '';
                        loadAdminBiometricStatus();
                    }
                });
            }

            if (adminBiometricToggle) {
                adminBiometricToggle.addEventListener('click', function(e) {
                    e.preventDefault();
                    var isOpen = adminBiometricSection.style.display !== 'none';
                    adminBiometricSection.style.display = isOpen ? 'none' : '';
                    if (!isOpen) loadAdminBiometricCredentials();
                });
            }

            function loadAdminBiometricStatus() {
                WebAuthnClient.getCredentials().then(function(creds) {
                    adminBiometricStatus.textContent = creds.length > 0 ? creds.length + ' ثبت‌شده' : 'فعال نشده';
                }).catch(function() { adminBiometricStatus.textContent = ''; });
            }

            function loadAdminBiometricCredentials() {
                adminBiometricList.innerHTML = 'در حال بارگذاری...';
                WebAuthnClient.getCredentials().then(function(creds) {
                    if (creds.length === 0) {
                        adminBiometricList.innerHTML = '<div style="color:#999;text-align:center;padding:0.5rem;">هیچ اثرانگشتی ثبت نشده</div>';
                        return;
                    }
                    adminBiometricList.innerHTML = '';
                    creds.forEach(function(c) {
                        var div = document.createElement('div');
                        div.style.cssText = 'display:flex;justify-content:space-between;align-items:center;padding:0.5rem 0;border-bottom:1px solid #eee;';
                        div.innerHTML = '<div><i class="fas fa-fingerprint" style="color:#667eea;margin-left:0.5rem;"></i>' + escapeHtml(c.deviceName || 'دستگاه ناشناس') + '<div style="font-size:0.7rem;color:#999;">' + new Date(c.createdAt).toLocaleDateString('fa-IR') + '</div></div>';
                        var delBtn = document.createElement('button');
                        delBtn.textContent = 'حذف';
                        delBtn.style.cssText = 'padding:4px 12px;border:none;background:#e74c3c;color:#fff;border-radius:6px;cursor:pointer;font-size:0.75rem;';
                        delBtn.addEventListener('click', function() {
                            if (!confirm('آیا از حذف این اثرانگشت مطمئن هستید؟')) return;
                            WebAuthnClient.removeCredential(c.id).then(function() {
                                loadAdminBiometricCredentials();
                                loadAdminBiometricStatus();
                            }).catch(function(e) { alert(e.message); });
                        });
                        div.appendChild(delBtn);
                        adminBiometricList.appendChild(div);
                    });
                }).catch(function(e) {
                    adminBiometricList.innerHTML = '<div style="color:red;text-align:center;">' + escapeHtml(e.message) + '</div>';
                });
            }

            if (addAdminBiometricBtn) {
                addAdminBiometricBtn.addEventListener('click', function() {
                    var name = prompt('نام دستگاه (مثلاً: کامپیوت من):');
                    if (name === null) return;
                    name = name.trim() || 'دستگاه ناشناس';
                    addAdminBiometricBtn.disabled = true;
                    addAdminBiometricBtn.textContent = 'در حال ثبت...';
                    WebAuthnClient.register(name).then(function() {
                        loadAdminBiometricCredentials();
                        loadAdminBiometricStatus();
                        addAdminBiometricBtn.disabled = false;
                        addAdminBiometricBtn.textContent = 'افزودن';
                        alert('اثرانگشت با موفقیت ثبت شد!');
                    }).catch(function(e) {
                        addAdminBiometricBtn.disabled = false;
                        addAdminBiometricBtn.textContent = 'افزودن';
                        alert('خطا: ' + e.message);
                    });
                });
            }
        });
    </script>

    <script>
        var menuOverlay = document.getElementById('menuOverlay');
        var menuSheet = document.getElementById('menuSheet');
        var bottomMenuBtn = document.getElementById('bottomMenuBtn');
        var menuSheetClose = document.getElementById('menuSheetClose');
        function openMenuSheet(){ menuOverlay.classList.add('show'); menuSheet.classList.add('show'); document.body.style.overflow='hidden'; }
        function closeMenuSheet(){ menuOverlay.classList.remove('show'); menuSheet.classList.remove('show'); document.body.style.overflow=''; }
        if(bottomMenuBtn) bottomMenuBtn.addEventListener('click', openMenuSheet);
        if(menuSheetClose) menuSheetClose.addEventListener('click', closeMenuSheet);
        if(menuOverlay) menuOverlay.addEventListener('click', closeMenuSheet);

        var _mobileNavRetries = 0;
        function buildAdminMobileNav(){
            var mobile = document.getElementById('mobileNav');
            if(!mobile) return;
            var MEGA = window.MEGA_MENU_DATA;
            if(!MEGA) { _mobileNavRetries++; if(_mobileNavRetries < 30) setTimeout(buildAdminMobileNav, 300); return; }
            mobile.innerHTML = '';
            var categoryNames = {'identity-judicial':'خدمات هویتی و قضایی','finance':'بانکی، مالی و بورسی','automotive':'خودرو و حمل و نقل','education':'آموزش و آزمون‌ها','business-tax':'مالیات، مجوز و کسب‌وکار','government-services':'سامانه‌های دولتی'};
            Object.keys(MEGA).forEach(function(key){
                var sections = MEGA[key];
                var accordionItem = document.createElement('div');
                accordionItem.className = 'accordion-item';
                var header = document.createElement('button');
                header.className = 'accordion-header';
                header.setAttribute('aria-expanded', 'false');
                header.textContent = categoryNames[key] || key;
                var body = document.createElement('div');
                body.className = 'accordion-body';
                var wrap = document.createElement('div');
                wrap.className = 'm-group';
                sections.forEach(function(section){
                    var h = document.createElement('h5');
                    h.textContent = section.title;
                    wrap.appendChild(h);
                    if(section.subItems){
                        section.subItems.forEach(function(sub){
                            var a = document.createElement('a');
                            a.href = sub.link;
                            a.textContent = sub.title;
                            wrap.appendChild(a);
                        });
                    }
                });
                body.appendChild(wrap);
                accordionItem.appendChild(header);
                accordionItem.appendChild(body);
                mobile.appendChild(accordionItem);
                header.addEventListener('click', function(){
                    var isOpen = header.getAttribute('aria-expanded') === 'true';
                    mobile.querySelectorAll('.accordion-header[aria-expanded="true"]').forEach(function(h){
                        h.setAttribute('aria-expanded', 'false');
                        h.nextElementSibling.style.maxHeight = '0';
                    });
                    if(!isOpen){
                        header.setAttribute('aria-expanded', 'true');
                        body.style.maxHeight = body.scrollHeight + 'px';
                    }
                });
            });
        }
        document.addEventListener('DOMContentLoaded', function(){
            setTimeout(buildAdminMobileNav, 300);
        });
    </script>
