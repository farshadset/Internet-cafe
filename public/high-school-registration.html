<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پیش ثبت نام متوسطه دوم</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <a href="index.html" class="logo-icon" title="صفحه اصلی">
            <i class="fas fa-mug-hot"></i>
        </a>
        <header>
            <h1>پیش ثبت نام متوسطه دوم</h1>
        </header>
        <main>
            <form id="serviceForm" class="form-card" data-service="high-school-registration">
                <div class="form-group">
                    <label for="parentPhone">شماره تلفن همراه پدر/مادر</label>
                    <input type="tel" id="parentPhone" name="parentPhone" placeholder="09xx-xxx-xxxx" required>
                </div>
                <div class="form-group">
                    <label for="parentNationalId">کد ملی والدین</label>
                    <input type="text" id="parentNationalId" name="parentNationalId" maxlength="10" required>
                </div>
                <div class="form-group">
                    <label for="studentNationalId">کد ملی دانش‌آموز</label>
                    <input type="text" id="studentNationalId" name="studentNationalId" maxlength="10" required>
                </div>
                <div class="form-group">
                    <label for="postalCode">کد پستی ۱۰ رقمی</label>
                    <input type="text" id="postalCode" name="postalCode" maxlength="10" required>
                </div>
                <div class="form-group">
                    <label for="preferredSchool">مدرسه مورد علاقه</label>
                    <input type="text" id="preferredSchool" name="preferredSchool">
                </div>
                <div class="form-group">
                    <label for="fieldOfStudy">رشته مورد علاقه</label>
                    <select id="fieldOfStudy" name="fieldOfStudy" required>
                        <option value="">انتخاب کنید</option>
                        <option value="math">ریاضی-فیزیک</option>
                        <option value="science">علوم تجربی</option>
                        <option value="humanities">انسانی</option>
                        <option value="arts">هنر</option>
                        <option value="work">کار و دنیزه</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="additionalNotes">توضیحات اضافی</label>
                    <div class="textarea-wrapper">

                        <textarea id="additionalNotes" name="additionalNotes" class="additional-notes"></textarea>

                        <div class="attachment-preview hidden" id="attachmentPreview"></div>

                        <button type="button" class="pin-attachment" id="pinAttachment" title="افزودن فایل">

                            <i class="fas fa-paperclip"></i>

                        </button>

                        <div class="textarea-placeholder" id="textareaPlaceholder">

                            <span>توضیحات خود را اینجا بنویسید ...</span><span class="cursor"></span>

                        </div>

                    </div>

                    <input type="file" id="attachmentFile" accept="image/*,.pdf" style="display: none;">
                </div>
                <button type="submit" class="btn-next">ثبت درخواست</button>
            </form>
        </main>
    </div>
    <link rel="stylesheet" href="fonts/all.css">
    <script src="app.js"></script>
</body>
</html>
