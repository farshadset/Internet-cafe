<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تمدید مهلت وام ازدواج</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <a href="index.html" class="logo-icon" title="صفحه اصلی">
            <i class="fas fa-mug-hot"></i>
        </a>
        <header>
            <h1>تمدید مهلت وام ازدواج</h1>
        </header>
        <main>
            <form id="serviceForm" class="form-card" data-service="marriage-loan-renew">
                <div class="form-group">
                    <label for="applicantPhone">شماره تلفن همراه</label>
                    <input type="tel" id="applicantPhone" name="applicantPhone" placeholder="09xx-xxx-xxxx" required>
                    <small><span class="warning-text">به نام متقاضی اصلی</span></small>
                </div>
                <div class="form-group">
                    <label for="trackingCode">کد رهنه قبلی</label>
                    <input type="text" id="trackingCode" name="trackingCode" maxlength="8" required>
                    <small>کد ۸ رقمی رهنه قبلی را وارد کنید</small>
                </div>
                <div class="form-group">
                    <label for="additionalNotes">توضیحات تمدید</label>
                    <textarea id="additionalNotes" name="additionalNotes" rows="3" placeholder="علت تمدید و مدت زمان مورد نیاز..."></textarea>
                </div>
                <button type="submit" class="btn-next">درخواست تمدید</button>
            </form>
        </main>
    </div>
    <link rel="stylesheet" href="fonts/all.css">
    <script src="app.js"></script>
</body>
</html>
