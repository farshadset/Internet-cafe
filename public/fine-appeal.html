<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اعتراض به جریمه</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <a href="index.html" class="logo-icon" title="صفحه اصلی">
            <i class="fas fa-mug-hot"></i>
        </a>
        <header>
            <h1>اعتراض به جریمه</h1>
        </header>
        <main>
            <form id="serviceForm" class="form-card" data-service="fine-appeal">
                <div class="form-group">
                    <label for="ownerPhone">شماره تلفن همراه</label>
                    <input type="tel" id="ownerPhone" name="ownerPhone" placeholder="09xx-xxx-xxxx" required>
                </div>
                <div class="form-group">
                    <label for="ownerNationalId">کد ملی صاحب خودرو</label>
                    <input type="text" id="ownerNationalId" name="ownerNationalId" maxlength="10" required>
                </div>
                <div class="form-group">
                    <label for="plateNumber">شماره پلاک خودرو</label>
                    <input type="text" id="plateNumber" name="plateNumber" required>
                </div>
                <div class="form-group">
                    <label for="violationNumber">شماره قصور/جریمه</label>
                    <input type="text" id="violationNumber" name="violationNumber" required>
                </div>
                <div class="form-group">
                    <label for="appealReason">دلیل اعتراض</label>
                    <textarea id="appealReason" name="appealReason" rows="3" required></textarea>
                </div>
                <div class="form-group">
                    <label for="additionalNotes">توضیحات اضافی</label>
                    <textarea id="additionalNotes" name="additionalNotes" rows="3"></textarea>
                </div>
                <button type="submit" class="btn-next">ثبت اعتراض</button>
            </form>
        </main>
    </div>
    <link rel="stylesheet" href="fonts/all.css">
    <script src="app.js"></script>
</body>
</html>
