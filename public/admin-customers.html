<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشتریان</title>
    <script src="libs/utils.js"></script>
    <script src="libs/notie.min.js"></script>
    <script>
        (function(){ if (!checkAdminAuth()) return; })();
    </script>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="stylesheet" href="fonts/all.css">
    <link rel="stylesheet" href="libs/notie.min.css">
</head>
<body>
    <div class="container">
        <main>
            <div style="max-width:480px;margin:0 auto;display:flex;justify-content:flex-start;margin-bottom:0.5rem;">
                <a class="btn btn-ghost back-link" href="javascript:void(0)" onclick="document.referrer ? history.back() : window.location='/admin'">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"></path></svg>
                    <span>بازگشت</span>
                </a>
            </div>
            <div class="form-card" id="adminCustomersList">
                <p>بارگذاری...</p>
            </div>
        </main>
    </div>

    <div class="popup-overlay" id="customerOrdersPopup">
        <div class="popup-content" style="max-width: 500px; width: 90%;">
            <h3>سفارش‌های مشتری</h3>
            <div id="customerOrdersList" style="max-height: 400px; overflow-y: auto; text-align: right;"></div>
            <div class="form-actions" style="margin-top: 1rem;">
                <button class="btn-next" id="closeOrdersPopup" style="background:#999;">بستن</button>
            </div>
        </div>
    </div>

    <script src="libs/browser-image-compression.js"></script>
    <script src="libs/utils.js"></script>
    <script src="app.js"></script>
    <script>
        (function(){ if (!checkAdminAuth()) return; })();
        document.addEventListener('DOMContentLoaded', function() {
            var container = document.getElementById('adminCustomersList');
            var ordersPopup = document.getElementById('customerOrdersPopup');
            var customerOrdersList = document.getElementById('customerOrdersList');
            var closeOrdersPopup = document.getElementById('closeOrdersPopup');
            var customersData = [];
            var sortField = '';
            var sortDir = 'asc';

            var escapeHtml = ChillUtils.escapeHtml;

            function getServiceTitle(order) {
                var title = order.title || '';
                if (!title || title === '-') {
                    var isFuelCard = order.ownerPhone || order.ownerNationalId || order.vin;
                    var isMarriageLoan = order.applicantPhone || order.applicantNationalId || order.idNumber;
                    var isKonkor = order.regionCode || order.educationLevel || order.applicantNationalId;
                    var isRental = order.contractNumber || order.depositAmount || order.iban;
                    var isHousing = order.ownershipStatus || order.familyCount;
                    var isIeltsToefl = order.passportNumber || order.examType;
                    var isInternet = order.address || order.operator;
                    var isCriminalRecord = order.birthplace;
                    var isSmartCard = order.serialNumber;
                    var isHealthInsurance = order.familyMembers;

                    if (isFuelCard) title = 'کارت سوخت';
                    else if (isMarriageLoan) title = 'وام ازدواج';
                    else if (isKonkor) title = 'کنکور سراسری';
                    else if (isRental) title = 'ودیعه مسکن اجاره';
                    else if (isHousing) title = 'نهضت ملی مسکن';
                    else if (isIeltsToefl) title = 'ثبت‌نام تافل و آیلتس';
                    else if (isInternet) title = 'ثبت‌نام اینترنت پرسرعت';
                    else if (isCriminalRecord) title = 'گواهی عدم سوء پیشینه';
                    else if (isSmartCard) title = 'کارت ملی هوشمند';
                    else if (isHealthInsurance) title = 'بیمه سلامت';
                    else title = 'پیش ثبت نام مدارس';
                }
                return title;
            }

            function renderCustomerOrders(orders) {
                customerOrdersList.innerHTML = '';
                if (orders.length === 0) {
                    customerOrdersList.innerHTML = '<p style="text-align:center;color:#999;">سفارشی یافت نشد.</p>';
                    return;
                }
                orders.forEach(function(order) {
                    var dateStr = order.created_at ? new Date(order.created_at).toLocaleDateString('fa-IR') : '-';
                    var div = document.createElement('div');
                    div.className = 'order-card';
                    div.style.marginBottom = '0.5rem';
                    div.innerHTML = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.25rem;">' +
                        '<div class="order-title">' + escapeHtml(getServiceTitle(order)) + '</div>' +
                        '<small style="color:#666;">' + dateStr + '</small>' +
                        '</div>' +
                        '<div style="margin-bottom:0.25rem;text-align:center;">' +
                        '<strong>کد سفارش: ' + escapeHtml(order.trackingCode) + '</strong>' +
                        '</div>' +
                        '<div class="order-actions">' +
                        '<a href="/order-detail?code=' + encodeURIComponent(order.trackingCode) + '" class="btn-view-detail">جزئیات سفارش</a>' +
                        '</div>';
                    customerOrdersList.appendChild(div);
                });
            }

            function sortCustomers(field) {
                if (sortField === field) {
                    sortDir = sortDir === 'asc' ? 'desc' : 'asc';
                } else {
                    sortField = field;
                    sortDir = 'asc';
                }
                customersData.sort(function(a, b) {
                    var valA = field === 'totalSpent' ? a.totalSpent : a.totalOrders;
                    var valB = field === 'totalSpent' ? b.totalSpent : b.totalOrders;
                    return sortDir === 'asc' ? valA - valB : valB - valA;
                });
                renderTable();
            }

            function getArrow(field) {
                if (sortField !== field) return '<i class="fas fa-sort" style="margin-right:4px;font-size:10px;opacity:0.5;"></i>';
                var icon = sortDir === 'asc' ? 'fa-sort-up' : 'fa-sort-down';
                return '<i class="fas ' + icon + '" style="margin-right:4px;font-size:10px;"></i>';
            }

            function renderTable() {
                container.innerHTML = '';
                if (customersData.length === 0) {
                    container.innerHTML = '<p style="text-align:center;color:#999;">مشتری یافت نشد.</p>';
                    return;
                }
                var table = document.createElement('table');
                table.style.cssText = 'width:100%;border-collapse:collapse;text-align:center;font-size:14px;';
                var thead = document.createElement('thead');
                thead.innerHTML = '<tr style="background:#227164;color:#fff;">' +
                    '<th style="padding:12px 8px;border-radius:0 8px 8px 0;">نام کاربری</th>' +
                    '<th data-sort="totalSpent" class="sortable-th" style="padding:12px 8px;cursor:pointer;user-select:none;">مجموع پرداختی' + getArrow('totalSpent') + '</th>' +
                    '<th data-sort="totalOrders" class="sortable-th" style="padding:12px 8px;cursor:pointer;user-select:none;">سفارش‌ها' + getArrow('totalOrders') + '</th>' +
                    '<th style="padding:12px 8px;border-radius:8px 0 0 8px;"></th>' +
                    '</tr>';
                table.appendChild(thead);
                var tbody = document.createElement('tbody');
                customersData.forEach(function(customer, index) {
                    var totalSpentFormatted = customer.totalSpent.toLocaleString('fa-IR');
                    var bgColor = index % 2 === 0 ? '#f8f9fa' : '#fff';
                    var tr = document.createElement('tr');
                    tr.style.cssText = 'background:' + bgColor + ';border-bottom:1px solid #eee;';
                    tr.innerHTML = '<td style="padding:10px 8px;font-weight:600;">' + escapeHtml(customer.username) + '</td>' +
                        '<td style="padding:10px 8px;">' + totalSpentFormatted + ' تومان</td>' +
                        '<td style="padding:10px 8px;">' + customer.totalOrders + ' سفارش</td>' +
                        '<td style="padding:10px 8px;"><a href="#" class="view-orders-btn" data-username="' + escapeHtml(customer.username) + '" style="color:#667eea;font-size:1.1rem;text-decoration:none;"><i class="fas fa-eye"></i></a></td>';
                    tbody.appendChild(tr);
                });
                table.appendChild(tbody);
                container.appendChild(table);

                document.querySelectorAll('.sortable-th').forEach(function(th) {
                    th.addEventListener('click', function() {
                        sortCustomers(this.getAttribute('data-sort'));
                    });
                });

                document.querySelectorAll('.view-orders-btn').forEach(function(btn) {
                    btn.addEventListener('click', function(e) {
                        e.preventDefault();
                        var username = this.getAttribute('data-username');
                        var customer = customersData.find(function(c) { return c.username === username; });
                        if (customer) {
                            renderCustomerOrders(customer.orders);
                            ordersPopup.classList.add('active');
                        }
                    });
                });
            }

            fetch('/api/admin/customers')
                .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
                .then(function(data) {
                    customersData = data.customers || [];
                    renderTable();
                })
                .catch(function() {
                    container.innerHTML = '<p style="text-align:center;color:red;">خطا در بارگذاری مشتریان.</p>';
                });

            closeOrdersPopup.addEventListener('click', function() {
                ordersPopup.classList.remove('active');
            });

            ordersPopup.addEventListener('click', function(e) {
                if (e.target === ordersPopup) ordersPopup.classList.remove('active');
            });
        });
    </script>
</body>
</html>
